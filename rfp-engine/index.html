<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}body{font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>RFP Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap">
<style>
/* Layout: app bar on top, step rail on the left, working area on the right.
   The canvas step adds an outline column and an asset column around a paper page column. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --sunk: #eceef2;
  --line: #d8dce3;
  --line-strong: #b9c0cb;
  --fg: #18202b;
  --muted: #5b6573;
  --faint: #8a93a1;
  --accent: #1d5c8c;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf6;
  --ok: #1f7a4d;
  --ok-soft: #e1f2e8;
  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --crit: #b3261e;
  --crit-soft: #fbe5e3;
  --paper: #ffffff;
  --paper-ink: #1b1b1b;
  --gap-mark: #fff1bf;
  --shadow: 0 1px 2px rgba(20, 30, 45, .08), 0 4px 16px rgba(20, 30, 45, .06);

  --f-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-doc: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --fs-xs: .75rem;
  --fs-s: .8125rem;
  --fs-m: .9375rem;
  --fs-l: 1.125rem;
  --fs-xl: 1.5rem;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #181d25; --sunk: #0d1116; --line: #2a313c; --line-strong: #3b4452;
    --fg: #e4e8ee; --muted: #a2abb8; --faint: #7a8494;
    --accent: #6fb0e3; --accent-ink: #0b1620; --accent-soft: #1b2e40;
    --ok: #5cc28d; --ok-soft: #15291f; --warn: #e2ad4a; --warn-soft: #2e2512; --crit: #f08079; --crit-soft: #351b1a;
    --paper: #f7f7f5; --paper-ink: #1b1b1b; --gap-mark: #fff1bf;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #181d25; --sunk: #0d1116; --line: #2a313c; --line-strong: #3b4452;
  --fg: #e4e8ee; --muted: #a2abb8; --faint: #7a8494;
  --accent: #6fb0e3; --accent-ink: #0b1620; --accent-soft: #1b2e40;
  --ok: #5cc28d; --ok-soft: #15291f; --warn: #e2ad4a; --warn-soft: #2e2512; --crit: #f08079; --crit-soft: #351b1a;
  --paper: #f7f7f5; --paper-ink: #1b1b1b; --gap-mark: #fff1bf;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: var(--fs-m)/1.5 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.tnum { font-variant-numeric: tabular-nums; }

/* App frame */
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .01em; }
.brand-mark { width: 22px; height: 22px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 14px; height: 14px; }
.proj-name { border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: var(--r); font-weight: 600; min-width: 0; width: min(320px, 40vw); }
.proj-name:hover, .proj-name:focus { border-color: var(--line); background: var(--bg); outline: none; }
.bar-spacer { flex: 1; }
.meter { display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); color: var(--muted); }
.meter-track { width: 90px; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.meter-fill { height: 100%; background: var(--ok); }
.meter-fill.warn { background: var(--warn); }
.meter-fill.crit { background: var(--crit); }
.ai-dot { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); color: var(--muted); }
.ai-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.ai-dot.on::before { background: var(--ok); }
.ai-dot.busy::before { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .ai-dot.busy::before { animation: none; } }

.body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 12px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.rail-group { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 12px 10px 4px; }
.step { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r); border: 0; background: transparent; text-align: left; cursor: pointer; color: var(--fg); }
.step:hover { background: var(--bg); }
.step.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.step-n { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: var(--fs-xs); font-family: var(--f-mono); color: var(--muted); }
.step.on .step-n { border-color: var(--accent); color: var(--accent); }
.step.done .step-n { background: var(--ok); border-color: var(--ok); color: #fff; }
.step-meta { font-size: var(--fs-xs); color: var(--faint); font-variant-numeric: tabular-nums; }
.main { min-width: 0; overflow-y: auto; padding: 20px 24px 60px; }
.main.flush { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

@media (max-width: 820px) {
  .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 16px; }
  .rail-group { display: none; }
  .step { grid-template-columns: 22px auto; white-space: nowrap; }
  .step-meta { display: none; }
  .main { padding: 16px 16px 60px; }
  .meter-track { display: none; }
}

/* Page headings and panels */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { font-size: var(--fs-xl); font-weight: 700; }
.head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2 { font-size: var(--fs-m); font-weight: 700; }
.panel-b { padding: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .grid-main { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: var(--fs-s); font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--bg); }
.btn.sm { padding: 3px 8px; font-size: var(--fs-xs); }
.btn.danger:hover { border-color: var(--crit); color: var(--crit); }
.btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn svg { width: 14px; height: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: var(--fs-s); font-weight: 600; }
.input, .textarea, .select { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 7px 9px; font-size: var(--fs-s); }
.textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.hint { font-size: var(--fs-xs); color: var(--faint); }

/* Chips and pills */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; border: 1px solid var(--line); color: var(--muted); background: var(--surface); white-space: nowrap; }
.pill.m { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag { display: inline-block; padding: 0 6px; border-radius: 3px; background: var(--sunk); color: var(--muted); font-size: var(--fs-xs); }
.rid { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--accent); background: var(--accent-soft); padding: 0 5px; border-radius: 3px; white-space: nowrap; cursor: pointer; border: 0; }

/* Banners */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: var(--fs-s); margin-bottom: 16px; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); }
.banner.crit { background: var(--crit-soft); }
.banner b { font-weight: 700; }
.banner .grow { flex: 1; min-width: 200px; }

/* Drop zone */
.drop { border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 22px; text-align: center; color: var(--muted); background: var(--bg); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop strong { color: var(--fg); display: block; margin-bottom: 4px; }

/* File list */
.files { display: flex; flex-direction: column; }
.file { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.file:first-child { border-top: 0; }
.file-ic { width: 30px; height: 36px; border-radius: 3px; border: 1px solid var(--line-strong); display: grid; place-items: end center; font: 600 9px var(--f-mono); color: var(--muted); padding-bottom: 3px; background: var(--surface); }
.file-ic.pdf { color: var(--crit); }
.file-ic.docx { color: var(--accent); }
.file-ic.xlsx, .file-ic.csv { color: var(--ok); }
.file-name { font-weight: 600; font-size: var(--fs-s); overflow-wrap: anywhere; }
.file-meta { font-size: var(--fs-xs); color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
.tbl th { text-align: left; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); background: var(--surface); position: sticky; top: 0; z-index: 1; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:hover td { background: var(--bg); }
.tbl td.txt { min-width: 280px; max-width: 560px; }
.tbl .unmapped td { background: var(--crit-soft); }

/* Format tree */
.tree { display: flex; flex-direction: column; }
.sec { display: grid; grid-template-columns: 18px 46px 1fr auto; gap: 8px; align-items: start; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface); }
.sec:first-child { border-top: 0; }
.sec.l2 { padding-left: 34px; }
.sec.drag-over-before { box-shadow: inset 0 2px 0 var(--accent); }
.sec.drag-over-after { box-shadow: inset 0 -2px 0 var(--accent); }
.sec.sel { background: var(--accent-soft); }
.grip { cursor: grab; color: var(--faint); padding-top: 3px; user-select: none; }
.grip svg { width: 14px; height: 14px; }
.sec-num { font-family: var(--f-mono); font-size: var(--fs-s); color: var(--muted); padding-top: 2px; }
.sec-title { font-weight: 600; border: 1px solid transparent; background: transparent; padding: 1px 4px; border-radius: 4px; width: 100%; }
.sec-title:hover, .sec-title:focus { border-color: var(--line); background: var(--bg); outline: none; }
.sec-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; padding-left: 4px; align-items: center; }
.sec-tools { display: flex; gap: 2px; opacity: .55; }
.sec:hover .sec-tools, .sec:focus-within .sec-tools { opacity: 1; }
.icon-btn { border: 0; background: transparent; padding: 4px; border-radius: 4px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--sunk); color: var(--fg); }
.icon-btn svg { width: 14px; height: 14px; }

/* Change review */
.change { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.change:first-child { border-top: 0; }
.change-src { font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.change-src.client { color: var(--crit); }
.change-src.user { color: var(--accent); }
.change-src.engine { color: var(--muted); }
.log { font-size: var(--fs-s); }
.log li { padding: 4px 0; border-top: 1px dashed var(--line); }
.log li:first-child { border-top: 0; }
.log ul { list-style: none; padding: 0; margin: 0; }

/* Outline cards */
.ocard { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.ocard-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ocard-h h3 { font-size: var(--fs-m); flex: 1; min-width: 180px; }
.ocard-b { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; padding: 12px 14px; }
.ocard-b > div { min-width: 0; }
.ocard ul { margin: 4px 0 0; padding-left: 18px; font-size: var(--fs-s); }
.ocard li { margin: 3px 0; }
.blockref { display: flex; gap: 6px; align-items: baseline; font-size: var(--fs-s); padding: 4px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.blockref:first-of-type { border-top: 0; }
.gap { font-weight: 700; color: var(--crit); }
.mode { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 0 5px; border-radius: 3px; border: 1px solid currentColor; }
.mode.verbatim { color: var(--ok); }
.mode.tailored { color: var(--accent); }
.mode.synthesized { color: var(--warn); }
.mode.manual { color: var(--muted); }

/* Library */
.lib-item { padding: 10px 0; border-top: 1px solid var(--line); }
.lib-item:first-child { border-top: 0; }
.lib-item h4 { font-size: var(--fs-s); }
.lib-item p { font-size: var(--fs-s); color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.thumb { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); font-size: var(--fs-xs); }
.thumb img { display: block; width: 100%; height: 80px; object-fit: contain; background: #fff; }
.thumb div { padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Canvas */
.cv { display: grid; grid-template-columns: 240px 1fr 260px; flex: 1; min-height: 0; }
.cv-col { overflow-y: auto; background: var(--surface); min-width: 0; }
.cv-left { border-right: 1px solid var(--line); }
.cv-right { border-left: 1px solid var(--line); }
.cv-col-h { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
.cv-col-h h3 { font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.cv-mid { overflow: auto; background: var(--sunk); min-width: 0; }
.cv-tools { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; }
.toggle button { border: 0; background: var(--surface); padding: 4px 10px; font-size: var(--fs-xs); font-weight: 600; cursor: pointer; color: var(--muted); }
.toggle button.on { background: var(--accent); color: var(--accent-ink); }
.mini-sec { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; padding: 6px 12px; font-size: var(--fs-s); cursor: pointer; border-left: 3px solid transparent; align-items: baseline; }
.mini-sec:hover { background: var(--bg); }
.mini-sec.l2 { padding-left: 24px; }
.mini-sec.over { border-left-color: var(--crit); }
.mini-sec .pg { font-size: var(--fs-xs); font-variant-numeric: tabular-nums; color: var(--faint); }
.mini-sec.over .pg { color: var(--crit); font-weight: 700; }
.asset-tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.asset { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: grab; font-size: var(--fs-s); }
.asset:hover { background: var(--bg); }
.asset img { width: 46px; height: 34px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 3px; flex: none; }
.asset .a-ic { width: 46px; height: 34px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: var(--bg); }
.asset .a-ic svg { width: 16px; height: 16px; }
.asset-t { min-width: 0; }
.asset-t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.asset-t span { font-size: var(--fs-xs); color: var(--faint); }

.paper-wrap { padding: 24px 16px 80px; display: flex; justify-content: center; }
.paper { position: relative; width: 100%; max-width: 816px; background: var(--paper); color: var(--paper-ink); box-shadow: var(--shadow); padding: 72px 80px; font-family: var(--f-doc); font-size: 11pt; line-height: 1.45; }
@media (max-width: 1100px) { .cv { grid-template-columns: 200px 1fr; } .cv-right { display: none; } .cv.assets-open .cv-right { display: block; position: fixed; right: 0; top: 0; bottom: 0; width: min(300px, 90vw); z-index: 30; box-shadow: var(--shadow); } }
@media (max-width: 720px) { .cv { grid-template-columns: 1fr; } .cv-left { display: none; } .paper { padding: 32px 22px; } }
.pbreak { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed #c7ccd4; pointer-events: none; z-index: 1; }
.pbreak span { position: absolute; right: 8px; top: -9px; background: var(--paper); color: #8a919c; font: 600 10px var(--f-mono); padding: 0 4px; }
.d-sec { position: relative; margin-bottom: 18px; }
.d-sec-h { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 8px; }
.d-sec-h h2 { font-family: var(--f-doc); font-size: 15pt; font-weight: 700; color: #102a43; }
.d-sec.l2 .d-sec-h h2 { font-size: 12.5pt; }
.d-sec-flag { font: 600 10px var(--f-ui); color: #b3261e; background: #fbe5e3; padding: 1px 6px; border-radius: 3px; }
.d-sec-pg { font: 600 10px var(--f-mono); color: #8a919c; margin-left: auto; }
.d-body { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; min-height: 30px; }
.d-empty { grid-column: 1 / -1; border: 1px dashed #c7ccd4; border-radius: 4px; padding: 14px; color: #8a919c; font: var(--fs-s) var(--f-ui); text-align: center; }

// Core helpers, project model, numbering, coverage and persistence.

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const RESP_TYPES = ['narrative', 'table', 'yes/no', 'form', 'attachment', 'compliance-matrix'];

function newProject(name) {
  return {

    type: 'rfp', context: { client: '', bidding: '', notes: '', winThemes: '', sources: [], stakeholders: [] },
    sourcePlan: { hints: '', glean: true, salesforce: true, figma: true },
    files: [], assets: [], library: [], requirements: [], objectives: [], topics: [],
    formatRules: {}, formatBasis: '', basisNote: '',
    sections: [], pending: null, changeLog: [], risks: [], matrix: [],
    reqSeq: 0, blockSeq: 0,
  };
}

/* Section numbering: level 1 gets 1, 2, 3; level 2 gets 1.1, 1.2. RFP-mandated numbers win when present. */
function numberSections(p = S.project) {
  let a = 0, b = 0;
  for (const s of p.sections) {
    if (s.level === 2) { b++; s.num = s.fixedNum || (a + '.' + b); }
    else { a++; b = 0; s.num = s.fixedNum || String(a); }
  }
}
const secById = id => S.project.sections.find(s => s.id === id);
const reqById = id => S.project.requirements.find(r => r.id === id);
const blockById = id => S.project.library.find(b => b.id === id) || WS.pinnedBlocks.find(b => b.id === id);
const assetById = id => S.project.assets.find(a => a.id === id);
const fileById = id => S.project.files.find(f => f.id === id);

function newSection(o = {}) {
  return {
    id: uid('s'), title: o.title || 'New section', level: o.level === 2 ? 2 : 1, origin: o.origin || 'user',
    reqIds: o.reqIds || [], pageLimit: o.pageLimit || null, guidance: o.guidance || '', summarizes: !!o.summarizes,
    fixedNum: o.fixedNum || '', userEdited: o.origin === 'user',

  };
}

/* Coverage: mandatory requirements mapped to a section (format), and cited by a drafted block (draft). */
function coverage(p = S.project) {
  // Layout, submission and scoring rules are met by the document itself, not by a section's answer.
  const mand = p.requirements.filter(r => r.mandatory && !['instruction', 'format', 'submission', 'evaluation'].includes(r.type));
  const mapped = new Set(p.sections.flatMap(s => s.reqIds));
  const cited = new Set();
  for (const s of p.sections) for (const b of s.blocks) for (const src of b.sources || []) if (src.t === 'req') cited.add(src.id);
  for (const s of p.sections) if (s.status === 'drafted') for (const id of s.reqIds) cited.add(id);
  return {
    total: mand.length,
    mapped: mand.filter(r => mapped.has(r.id)).length,
    addressed: mand.filter(r => cited.has(r.id)).length,
    unmapped: mand.filter(r => !mapped.has(r.id)),
  };
}

function reqSections(reqId) {
  return S.project.sections.filter(s => s.reqIds.includes(reqId));
}

/* Word budget from page limits: about 450 words per page of narrative after headings and visuals. */
function wordBudget(sec) {
  if (sec.pageLimit) return Math.round(sec.pageLimit * 450);
  return sec.level === 2 ? 350 : 500;
}

/* HTML sanitizer for model-written and pasted text. Keeps a small set of inline and list tags. */
const ALLOWED = new Set(['P', 'B', 'STRONG', 'I', 'EM', 'U', 'UL', 'OL', 'LI', 'BR', 'H4', 'SPAN']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const walk = node => {
    for (const c of Array.from(node.childNodes)) {
      if (c.nodeType === 1) {
        if (!ALLOWED.has(c.tagName)) {
          walk(c);
          while (c.firstChild) node.insertBefore(c.firstChild, c);
          c.remove();
          continue;
        }
        for (const a of Array.from(c.attributes)) if (!(c.tagName === 'SPAN' && a.name === 'class' && a.value === 'gapmark')) c.removeAttribute(a.name);
        walk(c);
      } else if (c.nodeType !== 3) c.remove();
    }
  };
  const root = doc.body.firstChild;
  walk(root);
  return markGaps(root.innerHTML);
}
function markGaps(html) {
  return html.replace(/(?<!gapmark">)\[((?:NEEDS (?:INPUT|VISUAL)|CONFIRM)[^\]]*)\]/g, '<span class="gapmark">[$1]</span>');
}
function textToHtml(t) {
  return String(t || '').split(/\n{2,}/).map(p => p.trim()).filter(Boolean)
    .map(p => /^[-•*]\s/m.test(p)
      ? '<ul>' + p.split(/\n/).map(l => '<li>' + esc(l.replace(/^[-•*]\s*/, '')) + '</li>').join('') + '</ul>'
      : '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
}
function htmlToText(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  d.querySelectorAll('li').forEach(li => li.prepend('- '));
  d.querySelectorAll('p,li,h4,br').forEach(el => el.append('\n'));
  return d.textContent.replace(/\n{3,}/g, '\n\n').trim();
}

/* Persistence: the open project autosaves to this browser (IndexedDB). Project files are the portable copy. */
const DB_NAME = 'rfp-engine', STORE = 'kv';
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbGet(key) {
  try {
    const db = await idb();
    return await new Promise((res, rej) => { const q = db.transaction(STORE).objectStore(STORE).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  } catch { return null; }
}
async function idbSet(key, val) {
  try {
    const db = await idb();
    await new Promise((res, rej) => { const t = db.transaction(STORE, 'readwrite'); t.objectStore(STORE).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
    return true;
  } catch { return false; }
}
let saveTimer = null, lastSaved = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (await idbSet('project', JSON.stringify(S.project))) { lastSaved = Date.now(); const el = $('#saved'); if (el) el.textContent = 'Saved in this browser'; }
  }, 500);
}
/* Original file bytes are kept separately so a PDF source can be shown at its page. */
const fileBytes = new Map();
async function keepBytes(fileId, buf) { fileBytes.set(fileId, buf); await idbSet('bytes:' + fileId, buf); }
async function getBytes(fileId) {
  if (fileBytes.has(fileId)) return fileBytes.get(fileId);
  const b = await idbGet('bytes:' + fileId);
  if (b) fileBytes.set(fileId, b);
  return b;
}

}

  try { const raw = await idbGet('pinnedBlocks'); if (raw) WS.pinnedBlocks = JSON.parse(raw); } catch { }
  for (let i = 0; i < 40 && !(window.claude && window.claude.use); i++) await sleep(250);

// Voice and style: house rules sent with every drafting prompt, and a checker that flags
// wording that reads as machine-written before anything reaches a customer.

// The style guide itself lives in the team workspace (workspace.js).
const DEFAULT_STYLE = DEFAULT_STYLE_GUIDE;
function styleOf() { return sg(); }
function bannedList() {
  return sg().banned.split(/[,\n]/).map(s => s.trim().toLowerCase()).filter(Boolean);
}

function styleRulesText() {
  const st = sg();
  const terms = terminologyPairs();
  return `HOUSE STYLE GUIDE (mandatory, the text goes to a client and must read as written by our proposal team):
Tone: ${st.tone}
Writing rules:
${st.rules}
${st.formatting ? 'Formatting conventions:\n' + st.formatting : ''}
${terms.length ? 'Terminology (use the first term, never the others):\n' + terms.map(t => `${t.use} (not: ${t.avoid.join(', ')})`).join('\n') : ''}
${st.facts ? 'Approved company facts and figures (use these exact values; never contradict them):\n' + st.facts : ''}
Never use these words or phrases: ${bannedList().join(', ')}.
Do not mention AI, Claude, models, drafts, prompts, the content library, block ids, source systems or this process anywhere in the prose.
${st.voiceSample ? `Match the rhythm and word choice of this sample of our own past writing:\n"""\n${st.voiceSample.slice(0, 2500)}\n"""` : ''}`;
}

/* Checker: returns issues with a short label and the matched text. Runs on plain text. */
function styleIssues(text) {
  const out = [];
  const lower = text.toLowerCase();
  for (const w of bannedList()) {
    const re = new RegExp('(^|[^a-z])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[^a-z])', 'gi');
    const n = (lower.match(re) || []).length;
    if (n) out.push({ kind: 'banned', label: `"${w}"`, n });
  }
  for (const t of terminologyPairs()) for (const a of t.avoid) {
    const re = new RegExp('(^|[^a-z])' + a.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[^a-z])', 'gi');
    const n = (lower.match(re) || []).length;
    if (n) out.push({ kind: 'term', label: `"${a}" (use "${t.use}")`, n });
  }
  const dashes = (text.match(/[—–]|\s--\s/g) || []).length;
  if (dashes) out.push({ kind: 'dash', label: 'Em or en dash', n: dashes });
  const nb = (text.match(/\bnot only\b[^.]{0,80}\bbut also\b/gi) || []).length;
  if (nb) out.push({ kind: 'pattern', label: '"Not only… but also"', n: nb });
  const q = (text.match(/\?(\s|$)/g) || []).length;
  if (q) out.push({ kind: 'pattern', label: 'Rhetorical question', n: q });
  const ex = (text.match(/!(\s|$)/g) || []).length;
  if (ex) out.push({ kind: 'pattern', label: 'Exclamation mark', n: ex });
  const triads = (text.match(/\b\w+(ly)?,\s\w+,\s(and|or)\s\w+\b/g) || []).length;
  if (triads > 2) out.push({ kind: 'pattern', label: 'Many lists of three', n: triads });
  const sents = text.split(/(?<=[.!?])\s+/).map(s => s.split(/\s+/).length).filter(n => n > 3);
  if (sents.length >= 6) {
    const mean = sents.reduce((a, b) => a + b, 0) / sents.length;
    const sd = Math.sqrt(sents.reduce((a, b) => a + (b - mean) ** 2, 0) / sents.length);
    if (sd / mean < 0.28) out.push({ kind: 'rhythm', label: 'Sentence lengths too uniform', n: 1 });
  }
  if (/\b(as an ai|language model|claude|chatgpt|generated by|this draft)\b/i.test(text)) out.push({ kind: 'leak', label: 'Mentions AI or drafting', n: 1 });
  if (/\b(B-\d{3}|R-\d{3}|A-\d{3})\b/.test(text) || /\b(glean|salesforce|slack|confluence)\b/i.test(text)) out.push({ kind: 'leak', label: 'Internal id in text', n: 1 });
  return out;
}
function blockText(b) {
  if (b.type === 'text' || b.type === 'callout') return htmlToText(b.html);
  if (b.type === 'image') return b.caption || '';
  if (b.type === 'table') return (b.rows || []).map(r => r.join(' ')).join('\n') + ' ' + (b.caption || '');
  return '';
}
function sectionStyleIssues(sec) {
  const all = [];
  for (const b of sec.blocks) {
    if (b.mode === 'verbatim') continue; // approved library text is the team's own writing
    for (const i of styleIssues(blockText(b))) all.push(Object.assign({ blockId: b.id }, i));
  }
  return all;
}
function projectStyleIssues() {
  return S.project.sections.map(s => ({ sec: s, issues: sectionStyleIssues(s) })).filter(x => x.issues.length);
}

/* Deterministic clean-up for the mechanical tells: dashes become commas, and stray spacing is fixed. */
function autoFixText(html) {
  return html
    .replace(/\s*[—]\s*/g, ', ')
    .replace(/(\d)\s*[–]\s*(\d)/g, '$1 to $2')
    .replace(/\s*[–]\s*/g, ', ')
    .replace(/\s--\s/g, ', ')
    .replace(/,\s*,/g, ',')
    .replace(/!(\s|<|$)/g, '.$1');
}

function promptRestyle(p, sec, items) {
  return `Rewrite these passages from section "${sec.title}" of an RFP response so they read as written by an experienced human proposal writer. Keep every fact, number, name and every [NEEDS INPUT: ...] and [CONFIRM: ...] marker exactly. Apply the terminology list. Do not add new claims. Keep the same HTML tags (<p>, <ul>, <li>, <b>, <i>).

${styleRulesText(p)}

Problems found by the style checker: ${items.map(i => i.issues.map(x => x.label).join(', ')).join(' | ')}

Passages:
${items.map(i => `### ${i.id}\n${i.html}`).join('\n\n')}

Return JSON: {"items":[{"id":"...","html":"..."}]}`;
}

async function restyleSection(sec) {
  const p = S.project;
  const targets = sec.blocks.filter(b => (b.type === 'text' || b.type === 'callout') && b.mode !== 'verbatim' && !b.locked)
    .map(b => ({ id: b.id, html: b.html, issues: styleIssues(htmlToText(b.html)) }))
    .filter(t => t.issues.length);
  if (!targets.length) { toast('No style issues in unlocked blocks of this section.'); return; }
  for (const t of targets) { const b = sec.blocks.find(x => x.id === t.id); b.html = autoFixText(b.html); t.html = b.html; t.issues = styleIssues(htmlToText(b.html)); }
  const still = targets.filter(t => t.issues.length);
  if (still.length && AI.sample) {
    const res = await askJSON(promptRestyle(p, sec, still), { label: `Rewriting flagged passages in ${sec.num}` });
    for (const it of (res && res.items) || []) {
      const b = sec.blocks.find(x => x.id === it.id);
      if (b && it.html) b.html = autoFixText(sanitize(it.html));
    }
  }
  logChange('engine', `Style pass on ${sec.num} ${sec.title}: ${targets.length} block(s) rewritten.`);
  save();
}

Return JSON with this shape:

${cands.map(b => `### ${b.id} | ${b.title} | [${tierTag(b)}] | tags: ${b.tags.join(', ')}\n${b.text.slice(0, 650)}`).join('\n\n') || 'none'}

Candidate images:
${imgs.map(a => `${a.id} | ${a.source === 'figma' ? 'PRODUCT (Figma library)' : a.source === 'example' ? 'example' : 'uploaded, non-product'} | ${a.caption || a.name} | tags: ${(a.tags || []).join(', ')}`).join('\n') || 'none'}
Image rule: product screenshots, UI, product diagrams and product graphics must come only from PRODUCT (Figma library) images. Uploaded images may be used only for non-product visuals such as team photos, maps, org charts or client logos.

${RULES_NO_FAB}

Return JSON:
{
 "keyPoints": [3 to 7 bullets the section should make, each tied to a requirement or objective],
 "blocks": [{"id":"B-...","reason":"one line on why it fits","mode":"verbatim" | "tailored" | "synthesized"}],
 "gaps": [{"text":"what is missing and why it matters","owner":"who likely has it, e.g. pricing lead, SME"}],
 "visuals": [{"assetId":"A-... or null","need":"what the visual shows","reason":"why it helps here"}],

}
Rules: only choose blocks from the candidates. Use "verbatim" only for approved-tier boilerplate that fits as is, never for other tiers, "tailored" when names or objectives need swapping in, "synthesized" when several blocks combine. List a gap only when no candidate covers the point. Suggest a visual only when it adds something; use assetId null when no image fits (that becomes a NEEDS VISUAL marker).`;
}

/* 6. Drafting, one section at a time. */
function promptDraft(p, sec, chosen, verbatim, others) {
  const reqs = sec.reqIds.map(reqById).filter(Boolean);

${(sec.conflicts || []).length ? 'Resolved conflicts to respect: ' + sec.conflicts.map(c => c.text + ' -> ' + c.resolution).join('; ') : ''}

Every text and callout item must list the block ids and requirement ids it draws on in "sources".`;

/* 7. Requirements matrix answers, in batches. */
function promptMatrix(p, rows) {

// Internal knowledge through the viewer's connectors: Glean (company search across Drive, Confluence,
// Slack, email and meeting notes) and Salesforce (opportunity, contacts and activity).

const GLEAN = 'Glean';
const SFDC = 'Salesforce - sobject-reads';
const KN = { mcp: null, state: 'connecting', pinSeq: 0 };

(async function connectKnowledge() {
  for (let i = 0; i < 40 && !(window.claude && window.claude.use); i++) await sleep(250);
  try { KN.mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch { KN.mcp = null; }
  KN.state = KN.mcp ? 'on' : 'off';
  if (typeof renderMain === 'function') renderMain();
})();

const KN_ERRORS = {
  server_not_connected: 'is not connected to your Claude account. Connect it in claude.ai settings.',
  needs_reauth: 'needs to be reconnected in claude.ai settings.',
  not_granted: 'access was declined for this page.',
  consent_required: 'needs your permission for this page first.',
  rate_limited: 'is rate limiting requests. Try again in a minute.',
  tool_error: 'could not complete that request.',
};
async function kcall(server, tool, input) {
  if (!KN.mcp) throw new Error('Connected sources work when this page is open on claude.ai.');
  try { return await KN.mcp.callTool(server, tool, input, { cache: false }); }
  catch (e) { const name = server === GLEAN ? 'Glean' : 'Salesforce'; throw new Error(`${name} ${KN_ERRORS[e && e.code] || (e && e.message) || 'request failed.'}`); }
}
function kText(res) {
  if (!res) return '';
  if (typeof res.payload === 'string') return res.payload;
  const t = (res.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  return t || (res.payload ? JSON.stringify(res.payload) : '');
}
function kJson(res) {
  if (res && res.payload && typeof res.payload === 'object') return res.payload;
  try { return JSON.parse(kText(res)); } catch { return null; }
}

/* Glean search results come back as Markdown: "## 1. Title", "**Source:** … • **Updated:** …", "**Link:** url", "> snippet". */
function parseGleanSearch(text) {
  const out = [];
  for (const part of text.split(/\n(?=## \d+\.\s)/)) {
    const m = part.match(/^## \d+\.\s+(.+)/);
    if (!m) continue;
    const link = (part.match(/\*\*Link:\*\*\s*(\S+)/) || [])[1];
    if (!link) continue;
    out.push({
      title: m[1].trim(), url: link,
      datasource: ((part.match(/\*\*Source:\*\*\s*([^•\n]+)/) || [])[1] || '').trim(),
      updated: ((part.match(/\*\*Updated:\*\*\s*([^•\n]+)/) || [])[1] || '').trim(),
      owner: ((part.match(/\*\*Owner:\*\*\s*([^•\n]+)/) || [])[1] || '').trim(),
      snippet: part.split('\n').filter(l => l.startsWith('>')).map(l => l.replace(/^>\s?/, '')).join(' ').slice(0, 400),
    });
  }
  return out;
}

/* Glean read_document returns a YAML-like listing: "  - datasource: …", "snippets[n]: "…"", "title: …", "url: "…"". */
function unq(s) { s = (s || '').trim(); if (s.startsWith('"')) { try { return JSON.parse(s); } catch { return s.slice(1, -1); } } return s; }
function parseGleanDocs(text, payload) {
  if (payload && Array.isArray(payload.documents)) {
    return payload.documents.map(d => ({ title: d.title || '', url: d.url || '', datasource: d.datasource || '', updated: d.updateTime || '', owner: (d.owner && d.owner.name) || '', text: [].concat(d.snippets || []).map(s => typeof s === 'string' ? s : s.text || '').join('\n\n') || (d.richDocumentData && d.richDocumentData.content) || '' }));
  }
  const docs = [];
  for (const seg of text.split(/\n\s*- datasource:\s*/).slice(1)) {
    const datasource = seg.split('\n')[0].trim();
    const field = k => { const m = seg.match(new RegExp('\\n\\s{2,6}' + k + ':\\s*(.*)')); return m ? unq(m[1]) : ''; };
    let body = '';
    const sm = seg.match(/snippets\[\d+\]:\s*("(?:[^"\\]|\\.)*")/);
    if (sm) body = unq(sm[1]);
    else { const lm = seg.match(/snippets\[\d+\]:\s*\n([\s\S]*?)\n\s{4}\w+:/); if (lm) body = lm[1].split(/\n\s*-\s*/).map(unq).join('\n\n'); }
    docs.push({ datasource, title: field('title'), url: field('url'), updated: field('updateTime'), owner: ((seg.match(/owner:\s*\n\s*name:\s*(.*)/) || [])[1] || '').trim(), text: body.replace(/\\n/g, '\n') });
  }
  return docs;
}

async function gleanSearch(query, { n = 8, updated } = {}) {
  const input = { query, _user_goal: 'Find internal sources for an RFP response: ' + query, num_results: n };
  if (updated) input.updated = updated;
  return parseGleanSearch(kText(await kcall(GLEAN, 'search', input)));
}
async function gleanRead(urls) {
  if (!urls.length) return [];
  const res = await kcall(GLEAN, 'read_document', { urls, _user_goal: 'Read internal sources for an RFP response' });
  return parseGleanDocs(kText(res), kJson(res));
}

/* Tier from what the source is: discussions are context only, roadmaps are product thinking, old answers are past responses. */
function guessTier(d) {
  const ds = (d.datasource || '').toLowerCase(), t = (d.title || '').toLowerCase();
  if (/slack|gmail|email|outlook|zoom|gong|meeting|teams|calendar/.test(ds) || /meeting notes|sync|standup|1:1|call notes|transcript/.test(t)) return 'internal';
  if (/roadmap|prd|strategy|vision|product brief|positioning|launch|release notes|pricing strategy/.test(t)) return 'product';
  if (/rfp|rfi|proposal|response|questionnaire|sow\b/.test(t)) return 'past';
  if (/library|lego|boilerplate|approved|messaging/.test(t)) return 'approved';
  return 'reference';
}
function pinnedTier(url) { const p = WS.data.sources.pinned.find(x => x.url === url); return p && p.tier; }

/* Long documents become retrievable blocks, split on headings and paragraphs. */
function docToBlocks(d, tier, origin) {
  const blocks = [];
  const text = (d.text || '').replace(/\r/g, '');
  let title = d.title, buf = '';
  const flush = () => {
    const t = buf.trim();
    if (t.length > 60) blocks.push({ id: origin === 'pinned' ? 'P-' + String(++KN.pinSeq).padStart(3, '0') : nextBlockId(), title: (title || d.title).slice(0, 120), text: t, fileId: null, fileName: d.title, loc: d.datasource || 'internal', tags: [], summary: '', tier, origin, url: d.url, updated: d.updated, owner: d.owner });
    buf = '';
  };
  for (const para of text.split(/\n{2,}/)) {
    const line = para.trim();
    if (!line) continue;
    const isHead = line.length < 90 && !/[.:;,]$/.test(line) && !line.includes('\n') && /^[A-Z0-9#]/.test(line);
    if ((isHead && buf.length > 200) || buf.length > 1600) flush();
    if (isHead && !buf) { title = line.replace(/^#+\s*/, ''); continue; }
    buf += (buf ? '\n\n' : '') + line;
    if (blocks.length > 120) break;
  }
  flush();
  return blocks;
}

/* Pinned sources: documents the team marks as the RFP library, product thinking and so on. Synced into a shared cache. */
async function syncPinned() {
  const pins = WS.data.sources.pinned.filter(p => p.url);
  if (!pins.length) throw new Error('Add at least one pinned document first.');
  const all = [];
  KN.pinSeq = 0;
  for (let i = 0; i < pins.length; i += 4) {
    toast(`Reading pinned sources ${i + 1}–${Math.min(i + 4, pins.length)} of ${pins.length}…`, { sticky: true });
    const docs = await gleanRead(pins.slice(i, i + 4).map(p => p.url));
    for (const d of docs) {
      const pin = pins.find(p => p.url === d.url) || pins[i];
      if (pin && !pin.title) pin.title = d.title;
      if (pin) pin.syncedAt = Date.now(), pin.updated = d.updated;
      all.push(...docToBlocks(d, (pin && pin.tier) || guessTier(d), 'pinned'));
    }
  }
  toast('');
  WS.pinnedBlocks = all;
  idbSet('pinnedBlocks', JSON.stringify(all));
  saveWorkspace();
  return all.length;
}

/* Research: find the best internal sources for one section, read them, and add their passages to the project library.
   With tool use, Claude searches iteratively; otherwise the engine runs one search per requirement. */
async function researchSection(sec) {
  const p = S.project;
  const reqs = sec.reqIds.map(reqById).filter(Boolean);
  const months = WS.data.sources.glean.recencyMonths || 18;
  const since = new Date(Date.now() - months * 30 * 864e5).toISOString().slice(0, 10);
  let picks = [];
  const caps = AI.sample && AI.sample.limits ? await AI.sample.limits().catch(() => null) : null;
  if (caps && caps.tools) {
    const seen = new Map();
    const tools = [{
      name: 'search_company',
      description: 'Search the company\'s internal knowledge (Drive, Confluence, Slack, email, meeting notes) and return up to 8 results with title, url, source system, last updated date and a snippet. Use short keyword queries.',
      inputSchema: { type: 'object', properties: { query: { type: 'string' } }, required: ['query'] },
      execute: async input => {
        const r = await gleanSearch(String(input.query || ''), { n: 8 });
        r.forEach(x => seen.set(x.url, x));
        return r.map(x => ({ title: x.title, url: x.url, source: x.datasource, updated: x.updated, snippet: x.snippet }));
      },
    }];
    const res = await askJSON(promptResearch(p, sec, reqs, since), { label: `Researching sources for ${sec.num} ${sec.title}`, tools });
    picks = ((res && res.sources) || []).filter(s => s.url && seen.has(s.url)).slice(0, 5).map(s => Object.assign({}, seen.get(s.url), { tier: TIERS[s.tier] ? s.tier : guessTier(seen.get(s.url)), why: s.why || '' }));
  } else {
    const queries = [sec.title + ' ' + (p.topics || []).slice(0, 2).join(' ')].concat(reqs.filter(r => r.mandatory).slice(0, 3).map(r => tokens(r.text).slice(0, 7).join(' ')));
    const hits = new Map();
    for (const q of queries) {
      toast(`Searching internal sources: ${q.slice(0, 50)}…`, { sticky: true });
      for (const [i, h] of (await gleanSearch(q, { n: 6 })).entries()) {
        const prev = hits.get(h.url);
        const score = (prev ? prev.score : 0) + (6 - i) + (TIERS[pinnedTier(h.url) || guessTier(h)].rank) + (h.updated >= since ? 2 : 0);
        hits.set(h.url, Object.assign(h, { score }));
      }
    }
    toast('');
    picks = [...hits.values()].sort((a, b) => b.score - a.score).slice(0, 4).map(h => Object.assign(h, { tier: pinnedTier(h.url) || guessTier(h) }));
  }
  const known = new Set(p.library.map(b => b.url).filter(Boolean));
  const fresh = picks.filter(x => !known.has(x.url));
  if (fresh.length) {
    const docs = await gleanRead(fresh.map(x => x.url));
    for (const d of docs) {
      const pick = fresh.find(x => x.url === d.url) || {};
      const blocks = docToBlocks(Object.assign({}, pick, d), pick.tier || guessTier(d), 'glean');
      p.library.push(...blocks);
    }
  }
  sec.research = { at: Date.now(), sources: picks.map(x => ({ title: x.title, url: x.url, tier: x.tier, updated: x.updated, why: x.why || '' })) };
  logChange('engine', `Found ${plural(picks.length, 'internal source')} for ${sec.num} ${sec.title}.`);
  save();
}

function promptResearch(p, sec, reqs, since) {
  return `Find the best internal company sources for one section of ${aType(p)}.
${ctxText(p)}
Section: ${sec.title}${sec.guidance ? ' (' + sec.guidance + ')' : ''}
Requirements it answers:
${reqs.map(r => '- ' + r.text).join('\n') || '- none mapped'}
${WS.data.sources.glean.hints ? 'Where the team keeps things: ' + WS.data.sources.glean.hints : ''}
Pinned team sources (prefer these): ${WS.data.sources.pinned.map(x => `${x.title || x.url} [${x.tier}]`).join('; ') || 'none'}

Use search_company two to four times with different short queries. Prefer, in order: approved library or boilerplate, the latest product thinking (roadmaps, PRDs) updated after ${since}, past responses to similar clients, then other internal docs. Use Slack, email or meeting notes only for client-specific context.
Return JSON: {"sources":[{"url":"exact url from a search result","title":"...","tier":"approved" | "product" | "past" | "reference" | "internal","why":"one line"}]}  (at most 5, best first)`;
}

/* Bid context from Salesforce and internal notes. */
function soqlStr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
async function findOpportunities(client) {
  const q = `SELECT Id, Name, StageName, Amount, CloseDate, Type, Account.Name, LastModifiedDate FROM Opportunity WHERE Account.Name LIKE '%${soqlStr(client)}%' OR Name LIKE '%${soqlStr(client)}%' ORDER BY LastModifiedDate DESC LIMIT 8`;
  const j = kJson(await kcall(SFDC, 'soqlQuery', { q }));
  return ((j && j.records) || []).map(r => ({ id: r.Id, name: r.Name, stage: r.StageName, amount: r.Amount, close: r.CloseDate, type: r.Type, account: r.Account && r.Account.Name }));
}
async function opportunityDetail(id) {
  const safe = soqlStr(id);
  const one = async q => { try { return (kJson(await kcall(SFDC, 'soqlQuery', { q })) || {}).records || []; } catch { return []; } };
  const [opp] = await one(`SELECT Id, Name, StageName, Amount, CloseDate, Type, Description, NextStep, LeadSource, Account.Name, Account.Industry, Account.Description, Owner.Name FROM Opportunity WHERE Id = '${safe}' LIMIT 1`);
  const contacts = await one(`SELECT Role, IsPrimary, Contact.Name, Contact.Title FROM OpportunityContactRole WHERE OpportunityId = '${safe}' LIMIT 25`);
  const tasks = await one(`SELECT Subject, Description, ActivityDate, Status FROM Task WHERE WhatId = '${safe}' ORDER BY ActivityDate DESC LIMIT 20`);
  const events = await one(`SELECT Subject, Description, ActivityDate FROM Event WHERE WhatId = '${safe}' ORDER BY ActivityDate DESC LIMIT 20`);
  return { opp, contacts, activity: tasks.concat(events) };
}

async function pullBidContext(oppId) {
  const p = S.project;
  const client = (p.context.client || '').trim();
  if (!client && !oppId) throw new Error('Enter the client name first.');
  const sources = [];
  let sf = null;
  if (oppId) {
    toast('Reading the Salesforce opportunity…', { sticky: true });
    sf = await opportunityDetail(oppId);
    if (sf.opp) sources.push({ kind: 'salesforce', title: 'Salesforce: ' + sf.opp.Name, id: sf.opp.Id });
  }
  const name = client || (sf && sf.opp && sf.opp.Account && sf.opp.Account.Name) || '';
  toast('Searching meeting notes and internal docs…', { sticky: true });
  const hits = new Map();
  for (const q of [`${name} meeting notes`, `${name} RFP`, `${name} call`, name]) {
    try { for (const h of await gleanSearch(q, { n: 6, updated: 'past_year' })) if (!hits.has(h.url)) hits.set(h.url, h); } catch (e) { if (!hits.size && q === name) throw e; }
  }
  const top = [...hits.values()].sort((a, b) => (b.updated || '').localeCompare(a.updated || '')).slice(0, 6);
  const docs = top.length ? await gleanRead(top.map(h => h.url)).catch(() => []) : [];
  for (const d of docs) sources.push({ kind: 'glean', title: d.title, url: d.url, updated: d.updated, datasource: d.datasource });
  toast('');
  const res = await askJSON(promptContext(p, name, sf, docs), { label: 'Summarizing the bid context', tier: 'complex' });
  return { res: res || {}, sources };
}

function promptContext(p, client, sf, docs) {
  return `Build the internal bid context for a response to ${client}. This is for our proposal team only and is never sent to the client.

${sf && sf.opp ? `Salesforce opportunity:\n${JSON.stringify(sf.opp).slice(0, 6000)}\nContacts:\n${JSON.stringify(sf.contacts).slice(0, 4000)}\nRecent activity:\n${JSON.stringify(sf.activity).slice(0, 12000)}` : 'No Salesforce opportunity selected.'}

Internal documents and notes (newest first):
${docs.map(d => `### ${d.title} (${d.datasource}, updated ${d.updated})\n${(d.text || '').slice(0, 9000)}`).join('\n\n') || 'none found'}

Current fields (keep anything still accurate):
${JSON.stringify(p.context)}

Return JSON:
{
 "client": "client's proper name",
 "bidding": "1 to 3 sentences on what we are bidding on: products, scope, size",
 "winThemes": "2 to 4 win themes, one per line, each tied to something the client said or cares about",
 "notes": "short lines covering: decision makers and their priorities, incumbent and how they are performing, budget and timeline, competitors, concerns and objections heard, open questions. Say where each point came from in brackets, e.g. [Salesforce] or [meeting notes, Sep 12]. Skip anything not supported by the material.",
 "stakeholders": [{"name":"...","title":"...","role":"decision maker | influencer | evaluator | champion | unknown"}]
}
Only use what is in the material. Do not invent names, numbers or dates.`;
}

/* Content library panel: search the tools the user picked, guided by their description of where things live. */
async function findSourcesFromPlan() {
  const p = S.project;
  const plan = p.sourcePlan;
  if (!plan.glean) throw new Error('Turn on company search (Glean) to look through internal tools.');
  if (p.sections.length) {
    for (const s of p.sections) { await researchSection(s); renderMain(); }
    return;
  }
  const hintLines = (plan.hints + '\n' + WS.data.sources.glean.hints).split(/\n|;/).map(s => s.trim()).filter(Boolean);
  const queries = hintLines.slice(0, 4).map(h => h.replace(/^(look in|check|search|use)\s+/i, '').slice(0, 80))
    .concat([p.context.client && p.context.bidding ? p.context.bidding.split(/[.,]/)[0] : '', (p.topics || []).slice(0, 3).join(' ')]).filter(Boolean);
  if (!queries.length) throw new Error('Describe where to look, or add bid context first.');
  const hits = new Map();
  for (const q of queries) {
    toast(`Searching: ${q.slice(0, 50)}…`, { sticky: true });
    for (const h of await gleanSearch(q, { n: 6 })) if (!hits.has(h.url)) hits.set(h.url, Object.assign(h, { tier: pinnedTier(h.url) || guessTier(h) }));
  }
  toast('');
  const known = new Set(p.library.map(b => b.url).filter(Boolean));
  const top = [...hits.values()].filter(h => !known.has(h.url)).sort((a, b) => TIERS[b.tier].rank - TIERS[a.tier].rank || (b.updated || '').localeCompare(a.updated || '')).slice(0, 6);
  const docs = await gleanRead(top.map(h => h.url));
  for (const d of docs) { const h = top.find(x => x.url === d.url) || {}; p.library.push(...docToBlocks(Object.assign({}, h, d), h.tier || guessTier(d), 'glean')); }
  logChange('engine', `Added ${plural(docs.length, 'internal document')} to the library from company search.`);
  save();
}
