(async function connectFigma() {
  for (let i = 0; i < 40 && !(window.claude && window.claude.use); i++) await sleep(250);
  try { FIG.mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch { FIG.mcp = null; }
  FIG.state = FIG.mcp ? 'on' : 'off';
  if (typeof renderMain === 'function') renderMain();
})();

const FIG_ERRORS = {
  server_not_connected: 'Figma is not connected to your Claude account. Connect it in claude.ai settings, then try again.',
  needs_reauth: 'Your Figma connection needs to be renewed in claude.ai settings.',
  not_granted: 'Figma access was declined for this page.',
  consent_required: 'Allow this page to use your Figma connector, then try again.',
  rate_limited: 'Figma is rate limiting requests. Wait a minute and try again.',
  tool_error: 'Figma could not read that file or frame. Check the link and that you have access.',
};
function figErr(e) { return FIG_ERRORS[e && e.code] || (e && e.message) || 'Figma request failed.'; }

/* Accepts figma.com/design/<key>/<name>?node-id=1-2 (and /file/, and branch links). */
function parseFigmaUrl(url) {
  const m = String(url).match(/figma\.com\/(?:design|file)\/([0-9a-zA-Z]{22,128})(?:\/branch\/([0-9a-zA-Z]{22,128}))?/);
  if (!m) return null;
  const node = (String(url).match(/node-id=([0-9]+[-:][0-9]+)/) || [])[1];
  return { fileKey: m[2] || m[1], nodeId: node ? node.replace('-', ':') : null };
}

function resultText(res) {
  if (!res) return '';
  if (typeof res.payload === 'string') return res.payload;
  const t = (res.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  return t || (res.payload ? JSON.stringify(res.payload) : '');
}
function resultImage(res) {
  const img = (res && res.content || []).find(c => c.type === 'image' && c.data);
  return img ? `data:${img.mimeType || 'image/png'};base64,${img.data}` : null;
}

/* Frames to use as library images: the direct children of the given node (a page or section). */
function parseFrames(xml) {
  const out = [];
  const doc = new DOMParser().parseFromString('<root>' + xml.replace(/^[\s\S]*?(<[a-z])/i, '$1') + '</root>', 'text/xml');
  const root = doc.documentElement;
  if (root.querySelector('parsererror')) {
    // Fall back to a flat scan of id and name attributes.
    for (const m of xml.matchAll(/<(frame|component|component-set|instance|section|group|rectangle)\b[^>]*\bid="([^"]+)"[^>]*\bname="([^"]*)"/gi)) out.push({ nodeId: m[2], name: m[3], type: m[1] });
    return out;
  }
  let top = Array.from(root.children);
  // A single wrapper (the page or section itself) means its children are the library items.
  while (top.length === 1 && top[0].children.length) top = Array.from(top[0].children);
  for (const el of top) {
    const id = el.getAttribute('id'), name = el.getAttribute('name');
    if (id && name) out.push({ nodeId: id, name, type: el.tagName.toLowerCase(), w: +el.getAttribute('width') || null, h: +el.getAttribute('height') || null });
  }
  return out;
}
function parsePages(text) {
  const pages = [];
  for (const m of text.matchAll(/(?:id|guid)["=:\s]+"?([0-9]+:[0-9]+)"?[^\n]*?name["=:\s]+"([^"]+)"/gi)) pages.push({ nodeId: m[1], name: m[2] });
  if (!pages.length) for (const m of text.matchAll(/([0-9]+:[0-9]+)\s*[|,:-]\s*([^\n]+)/g)) pages.push({ nodeId: m[1], name: m[2].trim() });
  return pages;
}

async function figmaCall(tool, input) {
  if (!FIG.mcp) throw new Error('The Figma connector is only available when this page is open on claude.ai.');
  try { return await FIG.mcp.callTool(FIGMA_SERVER, tool, input, { cache: false }); }
  catch (e) { throw new Error(figErr(e)); }
}

/* Sync: list frames on the linked page, keep ids stable, drop frames that no longer exist. */
async function syncFigmaLibrary() {
  const p = S.project;
  const link = p.figma && parseFigmaUrl(p.figma.url);
  if (!link) throw new Error('Paste a Figma design link first.');
  let nodeId = link.nodeId;
  toast('Reading the Figma library…', { sticky: true });
  try {
    if (!nodeId) {
      const pagesRes = await figmaCall('get_metadata', { fileKey: link.fileKey });
      const pages = parsePages(resultText(pagesRes));
      if (!pages.length) throw new Error('Could not find pages in that file. Link to the library page or section instead (copy link to selection in Figma).');
      p.figma.pages = pages;
      nodeId = (pages.find(pg => /librar|asset|visual|image|figure/i.test(pg.name)) || pages[0]).nodeId;
    }
    const meta = await figmaCall('get_metadata', { fileKey: link.fileKey, nodeId });
    const frames = parseFrames(resultText(meta));
    if (!frames.length) throw new Error('No frames found on that page. Put each library image in its own top-level frame.');
    const keep = new Set();
    for (const f of frames) {
      let a = p.assets.find(x => x.source === 'figma' && x.figma.nodeId === f.nodeId && x.figma.fileKey === link.fileKey);
      if (!a) { a = { id: 'A-' + String(p.assets.length + 1).padStart(3, '0'), source: 'figma', name: f.name, caption: f.name, tags: [], dataUrl: '', figma: { fileKey: link.fileKey, nodeId: f.nodeId } }; p.assets.push(a); }
      a.name = f.name; a.figma.w = f.w; a.figma.h = f.h; a.stale = false;
      keep.add(a.id);
    }
    // Frames that left the library stay on the canvas but are flagged so nobody exports an outdated image.
    for (const a of p.assets) if (a.source === 'figma' && !keep.has(a.id)) a.stale = true;
    p.figma.nodeId = nodeId; p.figma.syncedAt = Date.now();
    logChange('engine', `Synced ${frames.length} images from the Figma library.`);
    save();
    renderMain();
    await loadThumbs(p.assets.filter(a => a.source === 'figma' && !a.stale && !a.thumb).slice(0, 24));
  } finally { toast(''); }
}

async function loadThumbs(list) {
  for (const a of list) {
    try {
      const res = await figmaCall('get_screenshot', { fileKey: a.figma.fileKey, nodeId: a.figma.nodeId, maxDimension: 320, enableBase64Response: true });
      a.thumb = resultImage(res) || a.thumb;
    } catch { /* keep going, a thumbnail is optional */ }
    save();
    renderMain();
  }
}

/* Full render for placing on the canvas and for export. Always pulls the latest from Figma. */
async function fetchFigmaImage(a, maxDimension = 1600) {
  const res = await figmaCall('get_screenshot', { fileKey: a.figma.fileKey, nodeId: a.figma.nodeId, maxDimension, enableBase64Response: true });
  const url = resultImage(res);
  if (!url) throw new Error(`Figma returned no image for "${a.name}".`);
  a.dataUrl = url; a.fetchedAt = Date.now();
  if (!a.thumb) a.thumb = url;
  return url;
}

/* Before export, re-pull every image used on the canvas so the document carries the latest versions. */
async function refreshCanvasImages() {
  const used = new Set();
  for (const s of S.project.sections) for (const b of s.blocks) if (b.type === 'image' && b.assetId) used.add(b.assetId);
  const list = [...used].map(assetById).filter(a => a && a.source === 'figma' && !a.stale);
  let n = 0;
  for (const a of list) { toast(`Pulling latest images from Figma (${++n}/${list.length})…`, { sticky: true }); await fetchFigmaImage(a); }
  toast('');
  save();
  return list.length;
}

function figmaFrameUrl(a) {
  return `https://www.figma.com/design/${a.figma.fileKey}/?node-id=${a.figma.nodeId.replace(':', '-')}`;
}

/* ---- ingest.js ---- */
// File reading (PDF, Word, Excel/CSV, text, images), library chunking and retrieval.

if (window.pdfjsLib) {
  // The page cannot start a worker from a CDN, so pdf.js runs on the main thread using the worker
  // script loaded as a normal <script> tag (it registers window.pdfjsWorker).
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'data:application/javascript,';
}

function extOf(name) { return (name.split('.').pop() || '').toLowerCase(); }
const IMG_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];

function bufToDataUrl(buf, mime) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(new Blob([buf], { type: mime })); });
}

async function readAny(file) {
  const ext = extOf(file.name);
  const buf = await file.arrayBuffer();
  if (IMG_EXT.includes(ext)) {
    const mime = ext === 'svg' ? 'image/svg+xml' : ext === 'jpg' ? 'image/jpeg' : 'image/' + ext;
    return { kind: 'image', ext, buf, dataUrl: await bufToDataUrl(buf, mime) };
  }
  if (ext === 'pdf') return Object.assign({ kind: 'pdf', ext, buf }, await readPdf(buf));
  if (ext === 'docx') return Object.assign({ kind: 'docx', ext, buf }, await readDocx(buf));
  if (['xlsx', 'xls', 'csv'].includes(ext)) return Object.assign({ kind: 'sheet', ext, buf }, readSheet(buf, ext));
  if (['txt', 'md', 'markdown', 'html', 'htm'].includes(ext)) {
    let text = new TextDecoder().decode(buf);
    if (ext.startsWith('htm')) { const d = new DOMParser().parseFromString(text, 'text/html'); text = d.body.innerText || d.body.textContent; }
    return { kind: 'text', ext, buf, text, pages: [{ n: 1, text }] };
  }
  throw new Error(`${file.name}: this file type is not supported. Use PDF, DOCX, XLSX, CSV, TXT, MD or an image.`);
}

async function readPdf(buf) {
  if (!window.pdfjsLib) throw new Error('The PDF reader did not load. Reload the page and try again.');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    let out = '', lastY = null;
    for (const it of tc.items) {
      const y = it.transform ? Math.round(it.transform[5]) : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) out += '\n';
      else if (out && !out.endsWith(' ') && !out.endsWith('\n')) out += ' ';
      out += it.str;
      if (it.hasEOL) out += '\n';
      lastY = y;
    }
    pages.push({ n: i, text: out.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim() });
  }
  return { pages, text: pages.map(p => `[[PAGE ${p.n}]]\n${p.text}`).join('\n\n') };
}

async function readDocx(buf) {
  if (!window.mammoth) throw new Error('The Word reader did not load. Reload the page and try again.');
  const res = await mammoth.convertToHtml({ arrayBuffer: buf.slice(0) });
  const d = new DOMParser().parseFromString('<div>' + res.value + '</div>', 'text/html');
  const images = $$('img', d).map((img, i) => ({ dataUrl: img.getAttribute('src'), alt: img.getAttribute('alt') || '', idx: i }))
    .filter(x => x.dataUrl && x.dataUrl.startsWith('data:image'));
  // Note the nearest preceding heading for each image so it can carry a caption and a location.
  let heading = '';
  const imgHeading = [];
  d.body.firstChild.querySelectorAll('h1,h2,h3,h4,img').forEach(el => { if (el.tagName === 'IMG') imgHeading.push(heading); else heading = el.textContent.trim(); });
  images.forEach((im, i) => { im.heading = imgHeading[i] || ''; });
  const parts = [];
  d.body.firstChild.querySelectorAll('h1,h2,h3,h4,h5,p,li,table').forEach(el => {
    if (el.tagName === 'TABLE') { parts.push($$('tr', el).map(tr => $$('td,th', tr).map(c => c.textContent.trim()).join(' | ')).join('\n')); return; }
    if (el.closest('table')) return;
    const t = el.textContent.trim();
    if (!t) return;
    if (/^H\d/.test(el.tagName)) parts.push('#'.repeat(+el.tagName[1]) + ' ' + t);
    else if (el.tagName === 'LI') parts.push('- ' + t);
    else parts.push(t);
  });
  const text = parts.join('\n\n');
  return { text, pages: [{ n: 1, text }], images, html: res.value };
}

function readSheet(buf, ext) {
  if (!window.XLSX) throw new Error('The spreadsheet reader did not load. Reload the page and try again.');
  const wb = ext === 'csv' ? XLSX.read(new TextDecoder().decode(buf), { type: 'string' }) : XLSX.read(new Uint8Array(buf), { type: 'array' });
  const sheets = [], lines = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows: false, defval: '' });
    sheets.push({ name, rows });
    const header = rows[0] || [];
    rows.forEach((r, i) => {
      if (!r.some(c => String(c).trim())) return;
      const cells = r.map((c, j) => (i > 0 && header[j] ? header[j] + ': ' : '') + String(c).trim()).filter(c => !/:\s*$/.test(c) && c);
      lines.push(`[[ROW ${name}:${i + 1}]] ${cells.join(' | ')}`);
    });
  }
  const text = lines.join('\n');
  return { text, pages: [{ n: 1, text }], sheets };
}

/* Split text into chunks of about `size` characters on paragraph or row boundaries. */
function chunkText(text, size = 24000) {
  const out = [];
  let cur = '';
  for (const para of text.split(/\n(?=\[\[(?:PAGE|ROW) )|\n{2,}/)) {
    if (cur.length + para.length > size && cur) { out.push(cur); cur = ''; }
    if (para.length > size) { for (let i = 0; i < para.length; i += size) out.push(para.slice(i, i + size)); continue; }
    cur += (cur ? '\n\n' : '') + para;
  }
  if (cur) out.push(cur);
  return out;
}

/* Library blocks: Word and Markdown split on headings, PDFs on pages and paragraphs, spreadsheets one row per block. */
function splitLibrary(f, parsed) {
  const blocks = [];
  const add = (title, text, loc) => {
    text = text.trim();
    if (text.length < 40) return;
    blocks.push({ id: nextBlockId(), title: title.slice(0, 120) || f.name, text, fileId: f.id, fileName: f.name, loc, tags: [], summary: '', tier: f.tier || 'approved', origin: 'upload' });
  };
  if (parsed.kind === 'sheet') {
    for (const sh of parsed.sheets) {
      const header = sh.rows[0] || [];
      sh.rows.slice(1).forEach((r, i) => {
        const cells = r.map((c, j) => [header[j], String(c).trim()]).filter(([, v]) => v);
        if (!cells.length) return;
        add(String(cells[0][1]).slice(0, 100), cells.map(([h, v]) => (h ? h + ': ' : '') + v).join('\n'), `${sh.name} row ${i + 2}`);
      });
    }
    return blocks;
  }
  if (parsed.kind === 'pdf') {
    for (const pg of parsed.pages) {
      let buf = '', title = '';
      const flush = () => { if (buf) add(title || `${f.name} p.${pg.n}`, buf, 'p. ' + pg.n); buf = ''; title = ''; };
      for (const para of pg.text.split(/\n{2,}/)) {
        const first = para.split('\n')[0].trim();
        const looksHeading = first.length < 80 && para.split('\n').length > 1 && !/[.:,;]$/.test(first);
        if (buf.length > 1400 || (looksHeading && buf.length > 300)) flush();
        if (!buf && looksHeading) title = first;
        buf += (buf ? '\n\n' : '') + para;
      }
      flush();
    }
    return blocks;
  }
  // Heading-based split for docx, md and txt.
  const path = [];
  let title = '', buf = '';
  const flush = () => { if (buf.trim()) add(title || f.name, buf, path.join(' › ') || 'Start'); buf = ''; };
  for (const line of parsed.text.split('\n')) {
    const m = line.match(/^(#{1,4})\s+(.*)/);
    if (m) {
      flush();
      const lvl = m[1].length;
      path.length = lvl - 1; path[lvl - 1] = m[2].trim();
      title = m[2].trim();
    } else buf += line + '\n';
    if (buf.length > 3500) flush();
  }
  flush();
  return blocks;
}

/* Retrieval: tag filter first, then a BM25-style text score over block title and text. */
const STOP = new Set('the a an and or of to in for on with by be is are as at from that this it its will shall must should may can vendor proposer proposal respondent provide describe include including any all each their your our'.split(' '));
function tokens(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)); }
let idxCache = null;
function allBlocks() { return S.project.library.concat(WS.pinnedBlocks || []); }
function idxKey() { const lib = allBlocks(); return lib.length + ':' + lib.map(b => b.tags.length + (b.tier || '')[0]).join(''); }
function buildIndex() {
  const lib = allBlocks();
  const df = new Map(), docs = [];
  for (const b of lib) {
    const tf = new Map();
    for (const w of tokens(b.title + ' ' + b.title + ' ' + b.text + ' ' + (b.tags || []).join(' '))) tf.set(w, (tf.get(w) || 0) + 1);
    let len = 0; tf.forEach(v => len += v);
    docs.push({ b, tf, len });
    tf.forEach((_, w) => df.set(w, (df.get(w) || 0) + 1));
  }
  const avg = docs.reduce((a, d) => a + d.len, 0) / (docs.length || 1);
  idxCache = { df, docs, avg, n: docs.length, key: idxKey() };
  return idxCache;
}
function retrieve(query, { k = 8, tags = [] } = {}) {
  const lib = allBlocks();
  if (!lib.length) return [];
  const key = idxKey();
  const fresh = Date.now() - (WS.data.sources.glean.recencyMonths || 18) * 30 * 864e5;
  const ix = idxCache && idxCache.key === key ? idxCache : buildIndex();
  const q = [...new Set(tokens(query))];
  const tagSet = new Set(tags.map(t => t.toLowerCase()));
  const scored = ix.docs.map(d => {
    let s = 0;
    for (const w of q) {
      const f = d.tf.get(w); if (!f) continue;
      const idf = Math.log(1 + (ix.n - ix.df.get(w) + .5) / (ix.df.get(w) + .5));
      s += idf * (f * 2.2) / (f + 1.2 * (.25 + .75 * d.len / ix.avg));
    }
    const tagHits = (d.b.tags || []).filter(t => tagSet.has(t.toLowerCase()) || q.includes(t.toLowerCase())).length;
    if (s <= 0 && !tagHits) return { b: d.b, s: 0, tagHits };
    // Trust and freshness: approved and product sources rank higher, stale ones lower, discussions lowest.
    const tier = TIERS[d.b.tier || 'approved'] || TIERS.reference;
    const age = d.b.updated ? (Date.parse(d.b.updated) >= fresh ? 0.6 : -0.6) : 0;
    return { b: d.b, s: s + tagHits * 1.5 + tier.rank * 0.35 + age, tagHits };
  });
  // Tag filter first: when enough blocks share a tag with the query, rank only those.
  const tagged = scored.filter(x => x.tagHits > 0);
  const pool = tagged.length >= Math.min(k, 4) ? tagged : scored;
  return pool.filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, k).map(x => x.b);
}
function retrieveImages(query, k = 6) {
  const q = new Set(tokens(query));
  return S.project.assets.map(a => {
    const words = tokens((a.caption || '') + ' ' + a.name + ' ' + (a.tags || []).join(' '));
    return { a, s: words.filter(w => q.has(w)).length };
  }).filter(x => x.s > 0).sort((x, y) => y.s - x.s).slice(0, k).map(x => x.a);
}
function sectionQuery(sec) {
  return [sec.title, sec.guidance, ...sec.reqIds.map(id => (reqById(id) || {}).text || ''), ...sec.keyPoints].join(' ');
}

/* ---- pipeline.js ---- */
// The engine's steps: ingest, extract, recommend format, apply format ops, outline, draft, matrix.

async function addFiles(fileList, role) {
  const p = S.project;
  const added = [];
  for (const file of fileList) {
    try {
      toast(`Reading ${file.name}…`, { sticky: true });
      const parsed = await readAny(file);
      if (parsed.kind === 'image') {
        // Uploaded images are allowed for non-product visuals (photos, maps, org charts).
        p.assets.push({ id: 'A-' + String(p.assets.length + 1).padStart(3, '0'), source: 'upload', name: file.name, caption: file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' '), tags: [], dataUrl: parsed.dataUrl, thumb: parsed.dataUrl });
        added.push(file.name);
        continue;
      }
      const f = { id: uid('f'), name: file.name, ext: parsed.ext, role, size: file.size, text: parsed.text, pages: parsed.pages.map(pg => ({ n: pg.n, text: pg.text })), addedAt: Date.now(), processed: false, docType: '', reqCount: 0 };
      if (parsed.sheets) f.sheets = parsed.sheets.map(s => ({ name: s.name, rows: s.rows.slice(0, 2000) }));
      p.files.push(f);
      if (parsed.ext === 'pdf') await keepBytes(f.id, parsed.buf);
      if (role === 'library') {
        const blocks = splitLibrary(f, parsed);
        p.library.push(...blocks);
        f.blockCount = blocks.length;
        for (const im of parsed.images || []) {
          p.assets.push({ id: 'A-' + String(p.assets.length + 1).padStart(3, '0'), source: 'upload', name: `${file.name} image ${im.idx + 1}`, caption: im.alt || im.heading || file.name, tags: [], dataUrl: im.dataUrl, thumb: im.dataUrl, fileName: file.name });
        }
      } else if (p.sections.length) {
        f.isChange = true; // new client input after the format exists
      }
      added.push(file.name);
    } catch (e) {
      toast(e.message, { err: true });
      await sleep(1500);
    }
  }
  toast(added.length ? `Added ${plural(added.length, 'file')}.` : '');
  save();
  render();
  if (role === 'library' && added.length && AI.sample) tagLibrary().catch(e => toast(e.message, { err: true }));
}

async function tagLibrary() {
  const p = S.project;
  const todo = p.library.filter(b => !b.tags.length);
  for (let i = 0; i < todo.length; i += 20) {
    const batch = todo.slice(i, i + 20);
    const known = [...new Set(p.library.flatMap(b => b.tags))].slice(0, 80);
    const res = await askJSON(promptTag(batch, known), { label: `Tagging library blocks ${i + 1}–${Math.min(i + 20, todo.length)} of ${todo.length}`, tier: 'quick' });
    for (const r of (res && res.blocks) || []) {
      const b = blockById(r.id);
      if (b) { b.tags = (r.tags || []).map(t => String(t).toLowerCase()).slice(0, 6); b.summary = r.summary || ''; }
    }
    save(); renderMain();
  }
  const imgs = p.assets.filter(a => !(a.tags || []).length);
  if (imgs.length) {
    const known = [...new Set(p.library.flatMap(b => b.tags))].slice(0, 80);
    const res = await askJSON(promptTagImages(imgs.slice(0, 60), known), { label: 'Tagging images', tier: 'quick' });
    for (const r of (res && res.assets) || []) { const a = assetById(r.id); if (a) { a.tags = r.tags || []; if (r.caption && a.source === 'upload') a.caption = r.caption; } }
    save(); renderMain();
  }
}

async function extractRequirements() {
  const p = S.project;
  const files = p.files.filter(f => f.role === 'rfp' && !f.processed);
  if (!files.length) { toast('All RFP files are already processed.'); return; }
  const newReqs = [];
  p.mandated = p.mandated || []; p.criteria = p.criteria || []; p.keyDates = p.keyDates || [];
  for (const f of files) {
    const chunks = chunkText(f.text);
    for (let ci = 0; ci < chunks.length; ci++) {
      const res = await askJSON(promptExtract(f, chunks[ci], ci, chunks.length), { label: `Reading ${f.name}${chunks.length > 1 ? ` (part ${ci + 1} of ${chunks.length})` : ''}` });
      if (!res) continue;
      if (res.docType && !f.docType) f.docType = res.docType;
      for (const r of res.requirements || []) {
        if (!r.text) continue;
        const req = {
          id: nextReqId(), text: String(r.text).trim(), fileId: f.id, fileName: f.name, page: String(r.page || ''), section: String(r.section || ''),
          type: REQ_TYPES.includes(r.type) ? r.type : 'functional', mandatory: !!r.mandatory, weight: String(r.weight || ''),
          responseType: RESP_TYPES.includes(r.responseType) ? r.responseType : 'narrative', fromChange: !!f.isChange,
        };
        p.requirements.push(req); newReqs.push(req);
      }
      Object.assign(p.formatRules, res.formatRules || {});
      if ((res.mandatedStructure || []).length) p.mandated.push(...res.mandatedStructure);
      if ((res.evaluationCriteria || []).length) p.criteria.push(...res.evaluationCriteria);
      if ((res.keyDates || []).length) p.keyDates.push(...res.keyDates);
      save(); renderMain();
    }
    f.processed = true;
    f.reqCount = p.requirements.filter(r => r.fileId === f.id).length;
  }
  logChange('engine', `Extracted ${newReqs.length} requirements from ${plural(files.length, 'file')}.`);
  save();
  // New client input after the format exists goes through the change review, with client precedence.
  const changed = newReqs.filter(r => r.fromChange);
  if (changed.length && p.sections.length) {
    toast(`${plural(changed.length, 'new requirement')} from client input. Review the format changes.`);
    S.ui.step = 'format';
    render();
    await proposeFormatChange({ source: 'client', newReqs: changed, instruction: files.filter(f => f.isChange).map(f => f.name).join(', ') });
  }
}

async function recommendFormat() {
  const p = S.project;
  if (!p.requirements.length) throw new Error('Extract requirements first.');
  const res = await askJSON(promptFormat(p), { label: 'Recommending the response format', tier: 'complex' });
  if (!res || !Array.isArray(res.sections)) throw new Error('No format came back. Try again.');
  p.objectives = (res.objectives || []).slice(0, 5);
  p.topics = res.topics || [];
  p.formatBasis = res.formatBasis || 'default';
  p.basisNote = res.basisNote || '';
  // Keep the user's own sections and edits when re-recommending: generated sections are replaced, user ones stay.
  const userSecs = p.sections.filter(s => s.userEdited);
  const fresh = res.sections.map(s => newSection({ title: s.title, level: s.level, origin: s.origin || 'default', reqIds: (s.reqIds || []).filter(reqById), pageLimit: s.pageLimit, guidance: s.guidance, summarizes: s.summarizes, fixedNum: s.fixedNum }));
  for (const s of fresh) s.userEdited = false;
  p.sections = fresh.concat(userSecs.filter(u => !fresh.some(f => f.title.toLowerCase() === u.title.toLowerCase())));
  numberSections();
  logChange('engine', `Recommended a ${p.sections.length}-section format (${p.formatBasis.replace('-', ' ')}).`);
  save();
}

async function proposeFormatChange({ source, instruction = '', newReqs = [] }) {
  const p = S.project;
  numberSections();
  const res = await askJSON(promptFormatChange(p, { source, instruction, newReqs }), { label: source === 'client' ? 'Working out format changes from client input' : 'Working out the format change' });
  const ops = ((res && res.ops) || []).map(o => Object.assign({ key: uid('op'), source, accept: true }, o));
  // Engine-sourced ops never touch user-edited sections. Client ops may, and say so.
  for (const o of ops) {
    const target = o.id && secById(o.id);
    if (source === 'client' && target && target.userEdited) o.overridesUser = true;
  }
  p.pending = { source, summary: (res && res.summary) || '', ops, instruction, at: Date.now() };
  save();
  render();
}

function describeOp(o) {
  const t = id => { const s = secById(id); return s ? `${s.num} ${s.title}` : id; };
  switch (o.op) {
    case 'add': return `Add "${o.title}"${o.after ? ' after ' + t(o.after) : ' at the top'}${(o.reqIds || []).length ? ', mapped to ' + o.reqIds.join(', ') : ''}`;
    case 'remove': return `Remove ${t(o.id)}`;
    case 'rename': return `Rename ${t(o.id)} to "${o.title}"`;
    case 'move': return `Move ${t(o.id)}${o.after ? ' after ' + t(o.after) : ' to the top'}`;
    case 'merge': return `Merge ${(o.ids || []).map(t).join(' + ')} into "${o.title}"`;
    case 'split': return `Split ${t(o.id)} into ${(o.into || []).map(x => '"' + x.title + '"').join(', ')}`;
    case 'map': return `Map ${(o.reqIds || []).join(', ') || 'no requirements'} to ${t(o.id)}`;
    case 'limit': return `Set page limit of ${t(o.id)} to ${o.pageLimit || 'none'}`;
    case 'level': return `Make ${t(o.id)} a level ${o.level} section`;
    case 'rule': return `Set format rule ${o.key} to ${JSON.stringify(o.value)}`;
    default: return JSON.stringify(o);
  }
}

function applyOp(o) {
  const p = S.project;
  const idx = id => p.sections.findIndex(s => s.id === id);
  const insertAfter = (sec, after) => { const i = after ? idx(after) : -1; p.sections.splice(i + 1, 0, sec); };
  const mark = s => { if (s && o.source === 'user') s.userEdited = true; };
  switch (o.op) {
    case 'add': { const s = newSection({ title: o.title, level: o.level, origin: o.source === 'client' ? 'rfp' : 'user', reqIds: (o.reqIds || []).filter(reqById), pageLimit: o.pageLimit, guidance: o.guidance }); s.userEdited = o.source === 'user'; insertAfter(s, o.after); break; }
    case 'remove': { const i = idx(o.id); if (i >= 0) p.sections.splice(i, 1); break; }
    case 'rename': { const s = secById(o.id); if (s) { s.title = o.title; mark(s); } break; }
    case 'move': { const i = idx(o.id); if (i >= 0) { const [s] = p.sections.splice(i, 1); insertAfter(s, o.after); mark(s); } break; }
    case 'merge': {
      const secs = (o.ids || []).map(secById).filter(Boolean);
      if (secs.length < 2) break;
      const keep = secs[0];
      keep.title = o.title || keep.title;
      for (const s of secs.slice(1)) { keep.reqIds = [...new Set(keep.reqIds.concat(s.reqIds))]; keep.blocks = keep.blocks.concat(s.blocks); keep.keyPoints = keep.keyPoints.concat(s.keyPoints); p.sections.splice(idx(s.id), 1); }
      mark(keep); break;
    }
    case 'split': {
      const s = secById(o.id); if (!s) break;
      let after = s.id;
      (o.into || []).forEach((part, i) => {
        if (i === 0) { s.title = part.title; s.reqIds = (part.reqIds || s.reqIds).filter(reqById); mark(s); return; }
        const n = newSection({ title: part.title, level: s.level, origin: s.origin, reqIds: (part.reqIds || []).filter(reqById) });
        n.userEdited = o.source === 'user';
        insertAfter(n, after); after = n.id;
      });
      break;
    }
    case 'map': { const s = secById(o.id); if (s) { s.reqIds = (o.reqIds || []).filter(reqById); mark(s); } break; }
    case 'limit': { const s = secById(o.id); if (s) { s.pageLimit = o.pageLimit || null; mark(s); } break; }
    case 'level': { const s = secById(o.id); if (s) { s.level = o.level === 2 ? 2 : 1; mark(s); } break; }
    case 'rule': { if (o.key) p.formatRules[o.key] = o.value; break; }
  }
}

function applyPending() {
  const p = S.project;
  const pend = p.pending;
  if (!pend) return;
  const descs = pend.ops.map(o => ({ o, d: describeOp(o) }));
  for (const { o, d } of descs) {
    if (o.accept) {
      applyOp(o);
      logChange(o.source, d + (o.overridesUser ? ' (overrides your earlier edit)' : '') + (o.reason ? `. ${o.reason}` : ''));
    } else if (o.source === 'client') {
      // A rejected client-mandated change stays visible as a compliance risk.
      p.risks.unshift({ id: uid('risk'), text: d, reason: o.reason || '', at: Date.now() });
      logChange('user', `Kept your version instead of: ${d}. Flagged as a compliance risk.`);
    }
  }
  p.pending = null;
  for (const f of p.files) f.isChange = false;
  numberSections();
  save();
}

/* Outline */
async function outlineSection(sec) {
  const p = S.project;
  if (KN.state === 'on' && p.sourcePlan && p.sourcePlan.glean && !sec.research) {
    try { await researchSection(sec); } catch (e) { toast(e.message, { err: true }); await sleep(1200); }
  }
  const q = sectionQuery(sec) + ' ' + p.topics.join(' ');
  const cands = retrieve(q, { k: 10, tags: p.topics });
  const imgs = retrieveImages(q, 8);
  if (imgs.length < 4) for (const a of p.assets) { if (imgs.length >= 8) break; if (!imgs.includes(a)) imgs.push(a); }
  const res = await askJSON(promptOutline(p, sec, cands, imgs), { label: `Outlining ${sec.num} ${sec.title}` });
  if (!res) return;
  sec.keyPoints = res.keyPoints || [];
  sec.blockRefs = (res.blocks || []).filter(b => blockById(b.id)).map(b => ({ id: b.id, reason: b.reason || '', mode: MODES.includes(b.mode) ? b.mode : 'tailored' }));
  sec.gaps = (res.gaps || []).map(g => ({ text: g.text || String(g), owner: g.owner || '' }));
  sec.visuals = (res.visuals || []).map(v => ({ assetId: v.assetId && assetById(v.assetId) ? v.assetId : null, need: v.need || '', reason: v.reason || '' }));
  sec.tables = (res.tables || []).map(t => ({ kind: t.kind || 'custom', title: t.title || 'Table', reason: t.reason || '' }));
  sec.conflicts = (res.conflicts || []).filter(c => c && c.text).map(c => ({ text: c.text, sources: (c.sources || []).filter(blockById), resolution: c.resolution || '' }));
  if (sec.status === 'empty') sec.status = 'outlined';
  save();
}

async function outlineAll() {
  for (const s of S.project.sections) {
    await outlineSection(s);
    renderMain();
  }
}

/* Drafting */
function draftOrder() {
  const secs = S.project.sections;
  return secs.filter(s => !s.summarizes).concat(secs.filter(s => s.summarizes));
}

async function draftSection(sec) {
  const p = S.project;
  if (!sec.keyPoints.length && !sec.blockRefs.length) await outlineSection(sec);
  const chosen = [], verbatim = [];
  for (const r of sec.blockRefs) {
    const b = blockById(r.id); if (!b) continue;
    if (r.mode === 'verbatim' && (b.tier || 'approved') === 'approved') verbatim.push(b); else chosen.push(Object.assign({}, b, { _mode: r.mode }));
  }
  let others = '';
  if (sec.summarizes) {
    others = p.sections.filter(s => s !== sec && s.blocks.length)
      .map(s => `${s.num} ${s.title}: ${s.blocks.filter(b => b.type === 'text').map(b => htmlToText(b.html)).join(' ').slice(0, 450)}`).join('\n');
  }
  const prompt = promptDraft(p, sec, chosen, verbatim, others) + '\n\n' + styleRulesText();
  const res = await askJSON(prompt, { label: `Drafting ${sec.num} ${sec.title}`, tier: 'complex' });
  const items = (res && res.items) || [];
  const fresh = [];
  const usedVerbatim = new Set();
  for (const it of items) {
    if (it.type === 'verbatim') {
      const b = blockById(it.blockId); if (!b || usedVerbatim.has(b.id)) continue;
      usedVerbatim.add(b.id);
      fresh.push(newBlock({ type: 'text', html: textToHtml(b.text), mode: 'verbatim', sources: [{ t: 'lib', id: b.id }] }));
    } else if (it.html) {
      const srcs = (it.sources || []).map(id => /^R-/.test(id) ? (reqById(id) && { t: 'req', id }) : (blockById(id) && { t: 'lib', id })).filter(Boolean);
      fresh.push(newBlock({ type: it.type === 'callout' ? 'callout' : 'text', html: autoFixText(sanitize(it.html)), mode: MODES.includes(it.mode) ? it.mode : 'synthesized', sources: srcs }));
    }
  }
  for (const b of verbatim) if (!usedVerbatim.has(b.id)) fresh.push(newBlock({ type: 'text', html: textToHtml(b.text), mode: 'verbatim', sources: [{ t: 'lib', id: b.id }] }));
  // Visuals and tables agreed in the outline.
  for (const v of sec.visuals) {
    const a = v.assetId && assetById(v.assetId);
    fresh.push(newBlock({ type: 'image', assetId: a ? a.id : null, caption: a ? (a.caption || a.name) : v.need, need: a ? '' : v.need, sources: [] }));
  }
  for (const t of sec.tables) fresh.push(makeTable(t.kind, sec, t.title));
  // Locked blocks keep their place; everything else is replaced.
  const locked = sec.blocks.filter(b => b.locked);
  sec.blocks = locked.length ? mergeLocked(sec.blocks, fresh) : fresh;
  sec.status = 'drafted';
  sec.feedback = '';
  save();
}
function mergeLocked(old, fresh) {
  const out = [];
  let fi = 0;
  for (const b of old) {
    if (b.locked) out.push(b);
    else if (fi < fresh.length) out.push(fresh[fi++]);
  }
  while (fi < fresh.length) out.push(fresh[fi++]);
  return out;
}

async function draftAll() {
  for (const s of draftOrder()) {
    await draftSection(s);
    renderMain();
  }
}

function makeTable(kind, sec, title) {
  if (kind === 'compliance') {
    const reqs = (sec && sec.reqIds.length ? sec.reqIds.map(reqById) : S.project.requirements.filter(r => r.mandatory)).filter(Boolean);
    return newBlock({
      type: 'table', caption: title || 'Requirements compliance', mode: 'manual',
      rows: [['Ref', 'Requirement', 'Response section']].concat(reqs.map(r => [r.section || r.id, r.text.slice(0, 160), reqSections(r.id).map(s => s.num + ' ' + s.title).join('; ') || '[NEEDS INPUT: map this requirement]'])),
      sources: reqs.map(r => ({ t: 'req', id: r.id })),
    });
  }
  if (kind === 'timeline') return newBlock({ type: 'table', caption: title || 'Implementation timeline', mode: 'manual', rows: [['Phase', 'Activities', 'Duration'], ['Discovery', '[NEEDS INPUT: activities]', '[NEEDS INPUT]'], ['Build and configure', '', ''], ['Testing', '', ''], ['Launch', '', '']] });
  if (kind === 'team') return newBlock({ type: 'table', caption: title || 'Project team', mode: 'manual', rows: [['Role', 'Name', 'Responsibilities'], ['Project lead', '[NEEDS INPUT: name]', ''], ['Technical lead', '', ''], ['Account lead', '', '']] });
  return newBlock({ type: 'table', caption: title || 'Table', mode: 'manual', rows: [['Column 1', 'Column 2'], ['', '']] });
}

/* Compliance matrix track */
async function answerMatrix() {
  const p = S.project;
  const rows = p.requirements.filter(r => r.responseType === 'compliance-matrix' || r.responseType === 'yes/no');
  if (!rows.length) throw new Error('No matrix-style requirements found. Set a requirement\'s response type to compliance-matrix to include it.');
  for (let i = 0; i < rows.length; i += 12) {
    const batch = rows.slice(i, i + 12).map(req => ({ req, cands: retrieve(req.text, { k: 5, tags: p.topics }) }));
    const res = await askJSON(promptMatrix(p, batch) + '\n\n' + styleRulesText(), { label: `Answering matrix rows ${i + 1}–${Math.min(i + 12, rows.length)} of ${rows.length}` });
    for (const r of (res && res.rows) || []) {
      const existing = p.matrix.find(m => m.reqId === r.reqId);
      const row = { reqId: r.reqId, status: r.status || 'Needs input', comment: autoFixText(r.comment || ''), sources: (r.sources || []).filter(blockById), confidence: r.confidence || 'low' };
      if (existing) { if (!existing.locked) Object.assign(existing, row); } else p.matrix.push(row);
    }
    save(); renderMain();
  }
}

      <div class="panel-b stack-s">

        ${(ctx.stakeholders || []).length ? `<div><p class="label">Stakeholders</p>${ctx.stakeholders.map(s => `<div class="blockref"><b>${esc(s.name)}</b><span class="hint">${esc(s.title || '')}</span><span class="tag">${esc(s.role || '')}</span></div>`).join('')}</div>` : ''}

  </div>`;
}

/* Team workspace pages */

    ? (WS.canEdit ? '<b>Team settings.</b> Changes here apply to every project and everyone this page is shared with.' : '<b>Team settings, read only.</b> Editors of this page maintain them.')

}
function viewStyleGuide() {

  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>Voice</h2></div><div class="panel-b stack-s">

}

  <div class="grid-main">

      <div class="panel-b">${src.pinned.map((x, i) => `<div class="blockref" style="flex-wrap:wrap">

        <div class="field"><label for="ws-hints">Where things live</label><textarea class="textarea" id="ws-hints" rows="4" ${ro ? 'readonly' : ''} placeholder="e.g. Approved answers are in the Proposal Library Drive folder. Roadmaps live in the Product Confluence space.">${esc(src.glean.hints)}</textarea></div>

      <section class="panel"><div class="panel-h"><h2>Trust tiers</h2></div><div class="panel-b stack-s">

/* Library browser (reached from Inputs) */

    <section class="panel"><div class="panel-h"><h2>Text blocks</h2><span class="hint">${items.length} shown</span></div><div class="panel-b">
      ${items.slice(0, 200).map(b => `<div class="lib-item"><div class="row"><span class="rid" data-act="src" data-t="lib" data-id="${b.id}">${b.id}</span><h4>${esc(b.title)}</h4></div>
        <p>${esc(b.summary || b.text.slice(0, 240))}</p>
        <div class="row" style="margin-top:4px"><span class="pill ${b.tier === 'internal' ? 'warn' : b.tier === 'product' ? 'acc' : ''}">${(TIERS[b.tier || 'approved'] || TIERS.reference).short}</span>${b.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}<span class="hint">${esc(b.fileName)} · ${esc(b.loc)}${b.updated ? ' · ' + esc(String(b.updated).slice(0, 10)) : ''}</span></div></div>`).join('') || '<p class="hint">No blocks match.</p>'}
    </div></section>
    <section class="panel"><div class="panel-h"><h2>Images</h2></div><div class="panel-b">
      <div class="thumbs">${p.assets.map(a => `<div class="thumb"><img src="${a.thumb || a.dataUrl || ''}" alt=""><div title="${esc(a.caption || a.name)}"><span class="pill ${a.source === 'figma' ? 'acc' : ''}">${a.source === 'figma' ? 'Figma' : a.source === 'example' ? 'Example' : 'Upload'}</span> ${esc(a.caption || a.name)}</div></div>`).join('') || '<p class="hint">No images yet.</p>'}</div>
    </div></section>
  </div>`;
}

/* Requirements */
function viewRequirements() {
  const p = S.project;
  const c = coverage();
  const f = S.ui.reqFilter, q = S.ui.reqQuery.toLowerCase();
  const unmappedIds = new Set(c.unmapped.map(r => r.id));
  const rows = p.requirements.filter(r =>
    (f === 'all' || (f === 'mandatory' && r.mandatory) || (f === 'unmapped' && unmappedIds.has(r.id)) || r.type === f) &&
    (!q || (r.id + ' ' + r.text + ' ' + r.section).toLowerCase().includes(q)));
  const byType = REQ_TYPES.map(t => [t, p.requirements.filter(r => r.type === t).length]).filter(x => x[1]);
  const matrixRows = p.requirements.filter(r => r.responseType === 'compliance-matrix' || r.responseType === 'yes/no');
  if (!p.requirements.length) return `${aiBanner()}<div class="head"><div><h1>Requirements</h1></div></div><div class="panel empty"><h3>No requirements yet</h3><p>Add the client's RFP files on the Inputs step, then extract requirements.</p><p style="margin-top:12px"><button class="btn primary" data-act="go" data-step="inputs">Go to inputs</button></p></div>`;
  return `${exampleBanner()}${aiBanner()}
  <div class="head"><div><h1>Requirements</h1><p>Every requirement pulled from the RFP package, with its source. Fix types and mandatory flags here; the format and drafts follow from this list.</p></div>
    <div class="actions"><button class="btn" data-act="add-req">${ICON.plus} Add requirement</button><button class="btn primary" data-act="recommend" ${AI.state !== 'on' ? 'disabled' : ''}>${ICON.spark} ${p.sections.length ? 'Re-recommend format' : 'Recommend format'}</button></div></div>
  <div class="grid2" style="margin-bottom:16px">
    <section class="panel"><div class="panel-h"><h2>Summary</h2></div><div class="panel-b cov">
      <div><div class="cov-n">${p.requirements.length}</div><div class="hint">requirements</div></div>
      <div><div class="cov-n">${p.requirements.filter(r => r.mandatory).length}</div><div class="hint">mandatory</div></div>
      <div><div class="cov-n" style="color:${c.unmapped.length ? 'var(--crit)' : 'var(--ok)'}">${c.unmapped.length}</div><div class="hint">mandatory not mapped</div></div>
      <div style="flex-basis:100%" class="row">${byType.map(([t, n]) => `<span class="tag">${t} ${n}</span>`).join('')}</div>
    </div></section>
    <section class="panel"><div class="panel-h"><h2>Client objectives</h2><button class="btn sm ghost" data-act="add-obj">${ICON.plus} Add</button></div><div class="panel-b stack-s">
      ${p.objectives.map((o, i) => `<div class="row" style="flex-wrap:nowrap"><span class="mono faint">${i + 1}</span><input class="input" data-obj="${i}" value="${esc(o)}"><button class="icon-btn" data-act="rm-obj" data-i="${i}" aria-label="Remove objective">${ICON.x}</button></div>`).join('') || '<p class="hint">Objectives are proposed with the format. You can edit them.</p>'}
      ${p.topics.length ? `<div class="row">${p.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    </div></section>
    <section class="panel"><div class="panel-h"><h2>Format rules found</h2></div><div class="panel-b">
      ${Object.keys(p.formatRules).length ? `<dl class="kv">${Object.entries(p.formatRules).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(v) ? v.join('; ') : typeof v === 'object' ? JSON.stringify(v) : v)}</dd>`).join('')}</dl>` : '<p class="hint">None found yet.</p>'}
      ${(p.keyDates || []).length ? `<p class="label" style="margin-top:12px">Key dates</p><dl class="kv">${p.keyDates.map(d => `<dt>${esc(d.label)}</dt><dd>${esc(d.date)}</dd>`).join('')}</dl>` : ''}
    </div></section>
  </div>
  <section class="panel">
    <div class="panel-h"><div class="row">
      <select class="select" id="req-filter" style="width:auto">${[['all', 'All'], ['mandatory', 'Mandatory'], ['unmapped', 'Mandatory, not mapped']].concat(REQ_TYPES.map(t => [t, 'Type: ' + t])).map(([v, l]) => `<option value="${v}" ${f === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input class="input" id="req-q" placeholder="Search" value="${esc(S.ui.reqQuery)}" style="width:200px"></div>
      <span class="hint">${rows.length} shown</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Requirement</th><th>Type</th><th>M/O</th><th>Response</th><th>Mapped to</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${unmappedIds.has(r.id) ? 'unmapped' : ''}">
      <td><span class="rid" data-act="src" data-t="req" data-id="${r.id}">${r.id}</span></td>
      <td class="txt"><div contenteditable="true" data-req-text="${r.id}">${esc(r.text)}</div><div class="hint">${esc(r.fileName || 'Added manually')}${r.page ? ' · p. ' + esc(r.page) : ''}${r.section ? ' · §' + esc(r.section) : ''}${r.weight ? ' · weight ' + esc(r.weight) : ''}${r.fromChange ? ' · <b>from client change</b>' : ''}</div></td>
      <td><select class="select" data-req-type="${r.id}" style="width:auto">${REQ_TYPES.map(t => `<option ${r.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td><button class="pill ${r.mandatory ? 'm' : ''}" data-act="toggle-m" data-id="${r.id}">${r.mandatory ? 'Mandatory' : 'Optional'}</button></td>
      <td><select class="select" data-req-resp="${r.id}" style="width:auto">${RESP_TYPES.map(t => `<option ${r.responseType === t ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td>${reqSections(r.id).map(s => `<span class="tag">${esc(s.num)} ${esc(s.title.slice(0, 26))}</span>`).join(' ') || '<span class="faint">None</span>'}</td>
      <td><button class="icon-btn" data-act="rm-req" data-id="${r.id}" aria-label="Delete requirement">${ICON.x}</button></td></tr>`).join('')}
    </tbody></table></div>
  </section>
  ${matrixRows.length ? viewMatrix(matrixRows) : ''}`;
}

function viewMatrix(rows) {
  const p = S.project;
  return `<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Requirements matrix answers</h2>
    <div class="row"><span class="hint">${rows.length} rows · low confidence first</span><button class="btn sm primary" data-act="matrix" ${AI.state !== 'on' ? 'disabled' : ''}>${ICON.spark} Answer rows</button></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Requirement</th><th>Status</th><th>Comment</th><th>Sources</th><th>Confidence</th></tr></thead><tbody>
    ${rows.map(r => ({ r, m: p.matrix.find(x => x.reqId === r.id) })).sort((a, b) => ({ low: 0, medium: 1, high: 2, undefined: -1 }[a.m && a.m.confidence] - { low: 0, medium: 1, high: 2, undefined: -1 }[b.m && b.m.confidence])).map(({ r, m }) => `<tr>
      <td><span class="rid" data-act="src" data-t="req" data-id="${r.id}">${r.id}</span></td>
      <td class="txt">${esc(r.text.slice(0, 220))}</td>
      <td>${m ? `<select class="select" data-mx-status="${r.id}" style="width:auto">${['Comply', 'Partial', 'Roadmap', 'Does not comply', 'Needs input'].map(s => `<option ${m.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>` : '<span class="faint">Not answered</span>'}</td>
      <td class="txt">${m ? `<div contenteditable="true" data-mx-comment="${r.id}">${esc(m.comment)}</div>` : ''}</td>
      <td>${m ? m.sources.map(id => `<span class="rid" data-act="src" data-t="lib" data-id="${id}">${id}</span>`).join(' ') : ''}</td>
      <td>${m ? `<span class="pill ${m.confidence === 'high' ? 'ok' : m.confidence === 'medium' ? 'warn' : 'crit'}">${m.confidence}</span>` : ''}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

/* Format */
function viewFormat() {
  const p = S.project;
  numberSections();
  const c = coverage();
  if (!p.sections.length) return `${aiBanner()}<div class="head"><div><h1>Format</h1></div></div><div class="panel empty"><h3>No format yet</h3><p>Once requirements are extracted, the engine recommends a structure: the RFP's mandated order first, then the evaluation criteria, then a standard layout.</p><p style="margin-top:12px"><button class="btn primary" data-act="recommend" ${AI.state !== 'on' || !p.requirements.length ? 'disabled' : ''}>${ICON.spark} Recommend format</button> <button class="btn" data-act="add-sec">${ICON.plus} Start from scratch</button></p></div>`;
  const basis = { 'rfp-mandated': 'Mirrors the structure the RFP mandates', 'evaluation-criteria': 'Ordered by the evaluation criteria', default: 'Standard structure (the RFP sets none)' }[p.formatBasis] || '';
  const pend = p.pending;
  return `${exampleBanner()}${aiBanner()}
  <div class="head"><div><h1>Format</h1><p>${esc(basis)}${p.basisNote ? '. ' + esc(p.basisNote) : ''} Drag to reorder, rename in place, or describe a change in plain language. Client input outranks your edits, and your edits outrank the engine.</p></div>
    <div class="actions"><button class="btn" data-act="add-sec">${ICON.plus} Add section</button></div></div>
  ${pend ? viewPending(pend) : ''}
  ${c.unmapped.length ? `<div class="banner crit"><span class="grow"><b>${plural(c.unmapped.length, 'mandatory requirement')} not mapped to any section.</b> ${c.unmapped.slice(0, 6).map(r => `<span class="rid" data-act="src" data-t="req" data-id="${r.id}">${r.id}</span>`).join(' ')}${c.unmapped.length > 6 ? ' …' : ''}</span>

function draftCard(s) {
  const words = s.blocks.filter(b => b.type === 'text' || b.type === 'callout').reduce((a, b) => a + htmlToText(b.html).split(/\s+/).filter(Boolean).length, 0);
  const budget = wordBudget(s);
  const cited = new Set(s.blocks.flatMap(b => (b.sources || []).filter(x => x.t === 'req').map(x => x.id)));
  const reqs = s.reqIds.map(reqById).filter(Boolean);
  const issues = sectionStyleIssues(s);
  const gaps = s.blocks.reduce((a, b) => a + ((b.html || '').match(/NEEDS (INPUT|VISUAL)/g) || []).length + (b.type === 'image' && !b.assetId ? 1 : 0), 0);
  return `<article class="ocard">
    <div class="ocard-h"><span class="mono muted">${esc(s.num)}</span><h3>${esc(s.title)}</h3>
      ${s.summarizes ? '<span class="pill">Drafted last</span>' : ''}
      <span class="pill ${s.status === 'drafted' ? 'ok' : ''}">${s.status === 'drafted' ? 'Drafted' : 'Not drafted'}</span>
      ${s.status === 'drafted' ? `<span class="hint tnum">${words} / ~${budget} words</span>` : ''}
      ${reqs.length && s.status === 'drafted' ? `<span class="pill ${reqs.every(r => cited.has(r.id)) ? 'ok' : 'warn'}">${reqs.filter(r => cited.has(r.id)).length}/${reqs.length} reqs cited</span>` : ''}
      ${gaps ? `<span class="pill crit">${plural(gaps, 'gap')}</span>` : ''}
      ${issues.length ? `<span class="pill warn">${plural(issues.length, 'style issue')}</span>` : ''}
      <div class="actions">
        ${issues.length ? `<button class="btn sm" data-act="restyle" data-id="${s.id}">Fix style</button>` : ''}
        <button class="btn sm" data-act="draft-one" data-id="${s.id}" ${AI.state !== 'on' ? 'disabled' : ''}>${ICON.spark} ${s.status === 'drafted' ? 'Redraft' : 'Draft'}</button>
        <button class="btn sm ghost" data-act="canvas-to" data-id="${s.id}">On canvas</button></div></div>
    ${s.blocks.length ? `<div style="padding:12px 14px;max-height:360px;overflow:auto;font-family:var(--f-doc);font-size:var(--fs-m)">
      ${s.blocks.map(b => `<div style="margin-bottom:10px">${previewBlock(b)}<div class="row" style="margin-top:2px"><span class="mode ${b.mode}">${b.mode}</span>${(b.sources || []).map(srcChip).join('')}${b.locked ? '<span class="pill ok">Locked</span>' : ''}</div></div>`).join('')}</div>` : ''}
    ${issues.length ? `<div style="padding:0 14px 10px" class="row">${[...new Set(issues.map(i => i.label))].slice(0, 8).map(l => `<span class="tag">${esc(l)}</span>`).join('')}</div>` : ''}
    <div style="padding:10px 14px;border-top:1px solid var(--line)" class="row"><input class="input" data-fb="${s.id}" placeholder="Feedback for a redraft, e.g. lead with the 18-month timeline, cut the history" value="${esc(s.feedback || '')}" style="flex:1;min-width:200px">
      <button class="btn sm" data-act="redraft-fb" data-id="${s.id}" ${AI.state !== 'on' || s.status !== 'drafted' ? 'disabled' : ''}>Redraft with feedback</button></div>
  </article>`;
}

function previewBlock(b) {
  if (b.type === 'text') return `<div class="blk-text">${b.html}</div>`;
  if (b.type === 'callout') return `<div class="blk-callout" style="color:var(--paper-ink)">${b.html}</div>`;
  if (b.type === 'image') { const a = assetById(b.assetId); return a ? `<div class="row"><img src="${a.thumb || a.dataUrl}" alt="" style="height:48px;background:#fff;border:1px solid var(--line)"><span class="hint">${esc(b.caption || a.caption || a.name)}</span></div>` : `<span class="gapmark">[NEEDS VISUAL: ${esc(b.need || b.caption || '')}]</span>`; }
  if (b.type === 'table') return `<span class="hint">Table: ${esc(b.caption || '')} (${(b.rows || []).length - 1} rows)</span>`;
  return '';
}
function srcChip(src) {
  if (src.t === 'req') return `<button class="src req" data-act="src" data-t="req" data-id="${src.id}">${src.id}</button>`;
  return `<button class="src" data-act="src" data-t="lib" data-id="${src.id}">${src.id}</button>`;
}

/* Export */
function exportChecks() {
  const p = S.project;
  const checks = [];
  const c = coverage();
  let markers = 0, missingVis = 0, ids = 0, confirms = 0, fromDiscussion = 0;
  for (const s of p.sections) for (const b of s.blocks) {
    const t = blockText(b);
    markers += (t.match(/\[NEEDS (INPUT|VISUAL)/g) || []).length;
    confirms += (t.match(/\[CONFIRM/g) || []).length;
    if ((b.sources || []).some(x => x.t === 'lib' && (blockById(x.id) || {}).tier === 'internal')) fromDiscussion++;
    if (b.type === 'image' && !b.assetId) missingVis++;
    if (/\b(B|R|A|P)-\d{3}\b/.test(t)) ids++;
  }
  const empty = p.sections.filter(s => !s.blocks.length);
  const style = projectStyleIssues();
  const styleN = style.reduce((a, x) => a + x.issues.length, 0);
  const stale = p.assets.filter(a => a.stale && p.sections.some(s => s.blocks.some(b => b.assetId === a.id)));
  const fileNames = p.files.map(f => f.name).filter(n => n.length > 6);
  let nameLeaks = 0;
  for (const s of p.sections) for (const b of s.blocks) { const t = blockText(b); for (const n of fileNames.concat(allBlocks().filter(b => b.url).map(b => b.fileName).filter(n => n && n.length > 8))) if (t.includes(n)) nameLeaks++; }
  const overPages = p.sections.filter(s => s.pageLimit && s._pages && s._pages > s.pageLimit + 0.05);
  checks.push({ ok: !markers, sev: 'crit', text: markers ? `${plural(markers, 'gap marker')} still in the text ([NEEDS INPUT] or [NEEDS VISUAL])` : 'No gap markers left' });
  checks.push({ ok: !confirms, sev: 'crit', text: confirms ? `${plural(confirms, 'claim')} waiting for confirmation ([CONFIRM: ...], usually roadmap items or facts from internal discussion)` : 'No unconfirmed claims' });
  checks.push({ ok: !fromDiscussion, sev: 'warn', text: fromDiscussion ? `${plural(fromDiscussion, 'passage')} drawing on Slack, email or meeting notes. Check nothing internal shows through.` : 'Nothing drawn from internal discussion' });
  checks.push({ ok: !missingVis, sev: 'crit', text: missingVis ? `${plural(missingVis, 'visual placeholder')} without an image` : 'Every visual has an image' });
  checks.push({ ok: !c.unmapped.length, sev: 'crit', text: c.unmapped.length ? `${plural(c.unmapped.length, 'mandatory requirement')} not mapped to a section` : 'All mandatory requirements mapped' });
  checks.push({ ok: c.addressed >= c.total, sev: 'warn', text: `${c.addressed}/${c.total} mandatory requirements cited in the drafted text` });
  checks.push({ ok: !styleN, sev: 'crit', text: styleN ? `${plural(styleN, 'style issue')} that can read as machine-written, in ${plural(style.length, 'section')}` : 'Style check passed' });
  checks.push({ ok: !ids && !nameLeaks, sev: 'crit', text: ids || nameLeaks ? 'Internal ids or library file names appear in the text' : 'No internal references in the text' });
  checks.push({ ok: !stale.length, sev: 'crit', text: stale.length ? `${plural(stale.length, 'image')} no longer in the Figma library` : 'Product images match the Figma library' });
  checks.push({ ok: !empty.length, sev: 'warn', text: empty.length ? `${plural(empty.length, 'section')} with no content: ${empty.slice(0, 4).map(s => s.num).join(', ')}` : 'Every section has content' });
  checks.push({ ok: !overPages.length, sev: 'warn', text: overPages.length ? `Over the page limit: ${overPages.map(s => s.num).join(', ')}` : 'Within page limits (as last measured on the canvas)' });
  checks.push({ ok: !p.risks.length, sev: 'warn', text: p.risks.length ? `${plural(p.risks.length, 'client-mandated change')} not applied` : 'All client-mandated changes applied' });
  return checks;
}

      ${fileById(b.fileId) && fileById(b.fileId).ext === 'pdf' && /^p\. \d+/.test(b.loc) ? `<canvas class="pdfpage" id="pdf-canvas" data-file="${b.fileId}" data-page="${b.loc.replace('p. ', '')}"></canvas><p class="hint" style="margin:6px 0 12px">${esc(b.loc)} of ${esc(b.fileName)}</p>` : ''}
      <p class="label">Matched passage</p><pre><mark>${esc(b.text)}</mark></pre>
      <p class="label" style="margin-top:12px">Used in</p><p>${S.project.sections.filter(s => s.blocks.some(k => (k.sources || []).some(x => x.id === b.id))).map(s => esc(s.num + ' ' + s.title)).join(', ') || 'Not used yet'}</p>`;
  } else if (d.t === 'asset') {
    const a = assetById(d.id);
    if (!a) return '';
    title = a.caption || a.name;
    body = `<img src="${a.dataUrl || a.thumb}" alt="" style="width:100%;background:#fff;border:1px solid var(--line)">
      <dl class="kv" style="margin-top:12px"><dt>Source</dt><dd>${a.source === 'figma' ? 'Figma library' : a.source === 'example' ? 'Example image' : 'Uploaded'}</dd>${a.source === 'figma' ? `<dt>Frame</dt><dd><a href="${figmaFrameUrl(a)}" target="_blank" rel="noopener">${esc(a.name)}</a></dd><dt>Pulled</dt><dd>${a.fetchedAt ? new Date(a.fetchedAt).toLocaleString() : 'Thumbnail only'}</dd>` : ''}${a.fileName ? `<dt>File</dt><dd>${esc(a.fileName)}</dd>` : ''}</dl>`;
  }

    <div class="drawer-b"><p class="hint" style="margin-bottom:10px">Internal only. Sources never appear in the customer document.</p>${body}</div></aside>`;
}
function highlight(full, needle) {
  const n = needle.slice(0, 80).trim();
  const i = full.toLowerCase().indexOf(n.toLowerCase().slice(0, 50));
  if (i < 0) return esc(full.slice(0, 3000));
  const start = Math.max(0, i - 600), end = Math.min(full.length, i + needle.length + 600);
  return (start ? '…' : '') + esc(full.slice(start, i)) + '<mark>' + esc(full.slice(i, i + needle.length)) + '</mark>' + esc(full.slice(i + needle.length, end)) + (end < full.length ? '…' : '');
}
async function drawPdfPage() {
  const cv = $('#pdf-canvas');
  if (!cv || !window.pdfjsLib) return;
  const buf = await getBytes(cv.dataset.file);
  if (!buf) { cv.replaceWith(Object.assign(document.createElement('p'), { className: 'hint', textContent: 'The original PDF is not stored in this browser.' })); return; }
  try {
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false }).promise;
    const pg = await pdf.getPage(clamp(parseInt(cv.dataset.page, 10) || 1, 1, pdf.numPages));
    const vp = pg.getViewport({ scale: 1.4 });
    cv.width = vp.width; cv.height = vp.height;
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  } catch { /* text context below is still shown */ }
}

async function startPullContext() {

  if (plan.salesforce && p.context.client) {

async function runPullContext(oppId) {

    S.ui.pendingContext = { res, sources };
    const p = S.project, rows = [['client', 'Client'], ['bidding', 'What we are bidding on'], ['winThemes', 'Win themes'], ['notes', 'Notes on the client']];
    S.ui.modal = {
      title: 'Review bid context',

        + `<p class="label" style="margin-top:10px">Sources</p>${sources.map(s => `<div class="hint">${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</div>`).join('') || '<p class="hint">None found.</p>'}`,
      foot: '<button class="btn" data-act="close-modal">Discard</button><button class="btn primary" data-act="pull-context-apply">Fill in selected</button>',

function applyPulledContext() {
  const pc = S.ui.pendingContext; if (!pc) return;
  const c = S.project.context;
  for (const el of $$('[data-ctxpick]')) if (el.checked) c[el.dataset.ctxpick] = pc.res[el.dataset.ctxpick];

  S.ui.pendingContext = null; S.ui.modal = null;

/* Page measurement: 8.5 x 11 in page, 1 in margins, so the text area is 6.5 x 9 in. */
function measurePages() {
  const paper = $('#paper');
  if (!paper) return;
  const cs = getComputedStyle(paper);
  const contentW = paper.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const pageH = contentW * (9 / 6.5);
  const top0 = parseFloat(cs.paddingTop);
  $$('.pbreak', paper).forEach(x => x.remove());
  const totalH = paper.scrollHeight - top0 - parseFloat(cs.paddingBottom);
  const pages = Math.max(1, Math.ceil(totalH / pageH));
  for (let i = 1; i < pages; i++) {
    const d = document.createElement('div');
    d.className = 'pbreak'; d.style.top = (top0 + i * pageH) + 'px';
    d.innerHTML = `<span>PAGE ${i + 1}</span>`;
    paper.appendChild(d);
  }
  let overall = 0;
  for (const s of S.project.sections) {
    const el = $('#ds-' + s.id);
    if (!el) continue;
    const n = Math.round((el.offsetHeight / pageH) * 10) / 10;
    s._pages = n; overall += n;
    const over = s.pageLimit && n > s.pageLimit + 0.05;
    const label = `${n.toFixed(1)}${s.pageLimit ? ' / ' + s.pageLimit : ''} pp`;
    const a = $(`[data-pg="${s.id}"]`); if (a) { a.textContent = label; a.style.color = over ? '#b3261e' : ''; }
    const m = $(`[data-mpg="${s.id}"]`); if (m) { m.textContent = label; m.parentElement.classList.toggle('over', !!over); }
  }
  const lim = parseFloat(S.project.formatRules.pageLimit);
  const t = $('#cv-total');
  if (t) { t.textContent = `${pages}${lim ? ' / ' + lim : ''} pages`; t.style.color = lim && pages > lim ? 'var(--crit)' : ''; }
}

/* Block operations */
function findBlock(key) {
  const [sid, bid] = key.split(':');
  const s = secById(sid);
  const i = s ? s.blocks.findIndex(b => b.id === bid) : -1;
  return { s, i, b: s && s.blocks[i] };
}
function moveBlock(fromKey, toSecId, toIndex) {
  const { s, i, b } = findBlock(fromKey);
  if (!b) return;
  s.blocks.splice(i, 1);
  const t = secById(toSecId);
  if (t === s && toIndex > i) toIndex--;
  t.blocks.splice(clamp(toIndex, 0, t.blocks.length), 0, b);
  if (t !== s) logChange('user', `Moved a ${b.type} block from ${s.num} to ${t.num}.`);
}
function blockFromAsset(spec) {
  const [kind, id] = spec.split(':');
  if (kind === 'lib') { const lb = blockById(id); return lb && newBlock({ type: 'text', html: textToHtml(lb.text), mode: 'verbatim', sources: [{ t: 'lib', id: lb.id }] }); }
  if (kind === 'img') { const a = assetById(id); return a && newBlock({ type: 'image', assetId: a.id, caption: a.caption || a.name }); }
  if (kind === 'new') {
    if (id === 'text') return newBlock({ type: 'text', html: '<p>New paragraph.</p>' });
    if (id === 'callout') return newBlock({ type: 'callout', html: '<p>[NEEDS INPUT: key stat or proof point]</p>' });
    return makeTable(id, null);
  }
  return null;
}
async function ensureFullImage(b) {
  const a = assetById(b.assetId);
  if (a && a.source === 'figma' && !a.dataUrl && FIG.mcp) {
    try { await fetchFigmaImage(a); save(); renderMain(); } catch (e) { toast(e.message, { err: true }); }
  }
}

/* Drag and drop: blocks between and within sections, assets onto the page, sections in the outline. */
let drag = null;
function dropTarget(e) {
  const blk = e.target.closest('.blk');
  if (blk) {
    const r = blk.getBoundingClientRect();
    const after = blk.classList.contains('half') ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
    const { s, i } = findBlock(blk.dataset.blk);
    return { el: blk, secId: s.id, index: i + (after ? 1 : 0), after };
  }
  const body = e.target.closest('[data-dbody]');
  if (body) return { el: null, secId: body.dataset.dbody, index: secById(body.dataset.dbody).blocks.length };
  const sec = e.target.closest('[data-dsec]');
  if (sec) return { el: null, secId: sec.dataset.dsec, index: secById(sec.dataset.dsec).blocks.length };
  return null;
}
function clearDropMarks() { $$('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after')); $$('.drag-over-before,.drag-over-after').forEach(x => x.classList.remove('drag-over-before', 'drag-over-after')); }

document.addEventListener('dragstart', e => {
  const h = e.target.closest && e.target.closest('[data-dragblk]');
  const a = e.target.closest && e.target.closest('[data-dragasset]');
  const sec = e.target.closest && e.target.closest('[data-sec],[data-msec]');
  if (h) { drag = { kind: 'blk', key: h.dataset.dragblk }; e.dataTransfer.setDragImage(h.closest('.blk'), 10, 10); }
  else if (a) drag = { kind: 'asset', spec: a.dataset.dragasset };
  else if (sec) drag = { kind: 'sec', id: sec.dataset.sec || sec.dataset.msec };
  else return;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', 'rfp'); } catch { }
});
document.addEventListener('dragover', e => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
    const z = e.target.closest('[data-drop], .ph, [data-dbody]');
    if (z) { e.preventDefault(); if (z.dataset.drop) z.classList.add('over'); }
    return;
  }
  if (!drag) return;
  if (drag.kind === 'sec') {
    const row = e.target.closest('[data-sec],[data-msec]');
    if (!row) return;
    e.preventDefault(); clearDropMarks();
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY > r.top + r.height / 2 ? 'drag-over-after' : 'drag-over-before');
    return;
  }
  const t = dropTarget(e);
  if (!t) return;
  e.preventDefault(); clearDropMarks();
  if (t.el) t.el.classList.add(t.after ? 'drop-after' : 'drop-before');
});
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', async e => {
  // Files dropped on an upload zone or on a page.
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    const z = e.target.closest('[data-drop]');
    if (z) { e.preventDefault(); z.classList.remove('over'); await addFiles(Array.from(e.dataTransfer.files), z.dataset.drop); return; }
    const t = dropTarget(e);
    if (t && S.ui.step === 'canvas') {
      e.preventDefault();
      const imgs = Array.from(e.dataTransfer.files).filter(f => IMG_EXT.includes(extOf(f.name)));
      const before = S.project.assets.length;
      await addFiles(imgs, 'library');
      const added = S.project.assets.slice(before);
      const sec = secById(t.secId);
      const ph = e.target.closest('.blk') && findBlock(e.target.closest('.blk').dataset.blk);
      if (ph && ph.b && ph.b.type === 'image' && !ph.b.assetId && added[0]) { ph.b.assetId = added[0].id; ph.b.caption = ph.b.caption || added[0].caption; }
      else added.forEach((a, k) => sec.blocks.splice(t.index + k, 0, newBlock({ type: 'image', assetId: a.id, caption: a.caption })));
      save(); renderMain();
    }
    return;
  }
  if (!drag) return;
  e.preventDefault();
  const d = drag; drag = null;
  clearDropMarks();
  if (d.kind === 'sec') {
    const row = e.target.closest('[data-sec],[data-msec]');
    if (!row) return;
    const targetId = row.dataset.sec || row.dataset.msec;
    if (targetId === d.id) return;
    const r = row.getBoundingClientRect();
    const after = e.clientY > r.top + r.height / 2;
    const list = S.project.sections;
    const [moved] = list.splice(list.findIndex(s => s.id === d.id), 1);
    list.splice(list.findIndex(s => s.id === targetId) + (after ? 1 : 0), 0, moved);
    moved.userEdited = true;
    numberSections();
    logChange('user', `Moved ${moved.title} to position ${moved.num}.`);
    save(); render();
    return;
  }
  const t = dropTarget(e);
  if (!t) return;
  if (d.kind === 'blk') moveBlock(d.key, t.secId, t.index);
  else {
    // Dropping an image onto an empty visual placeholder fills it.
    const ph = e.target.closest('.blk') && findBlock(e.target.closest('.blk').dataset.blk);
    if (d.spec.startsWith('img:') && ph && ph.b && ph.b.type === 'image' && !ph.b.assetId) {
      const a = assetById(d.spec.slice(4)); ph.b.assetId = a.id; ph.b.caption = ph.b.caption || a.caption || a.name; ph.b.need = '';
      await ensureFullImage(ph.b);
    } else {
      const b = blockFromAsset(d.spec);
      if (b) { secById(t.secId).blocks.splice(t.index, 0, b); if (b.type === 'image') ensureFullImage(b); }
    }
  }
  save(); renderMain();
});
document.addEventListener('dragend', () => { drag = null; clearDropMarks(); });

/* Text edits on the canvas update the model without re-rendering, so the caret stays put. */
document.addEventListener('input', e => {

document.addEventListener('focusout', e => {

function safeName(s) { return String(s || 'response').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 80) || 'response'; }

/* Images go into Word as PNG, sized to the text width (6.5 in) or half of it. */
function imageToPng(dataUrl, maxW) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const w0 = img.naturalWidth || 800, h0 = img.naturalHeight || 500;
      const scale = Math.min(1, 1600 / w0);
      const cv = document.createElement('canvas');
      cv.width = Math.round(w0 * scale); cv.height = Math.round(h0 * scale);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(async b => {
        if (!b) return rej(new Error('Image conversion failed.'));
        const w = Math.min(maxW, w0), h = Math.round(w * h0 / w0);
        res({ data: new Uint8Array(await b.arrayBuffer()), width: w, height: h });
      }, 'image/png');
    };
    img.onerror = () => rej(new Error('An image could not be read.'));
    img.src = dataUrl;
  });
}

function htmlToDocx(html, D) {
  const out = [];
  const d = document.createElement('div');
  d.innerHTML = html || '';
  const runs = (node, fmt = {}) => {
    const r = [];
    for (const c of node.childNodes) {
      if (c.nodeType === 3) { if (c.textContent) r.push(new D.TextRun(Object.assign({ text: c.textContent }, fmt))); }
      else if (c.nodeType === 1) {
        if (c.tagName === 'BR') { r.push(new D.TextRun({ text: '', break: 1 })); continue; }
        const f = Object.assign({}, fmt);
        if (c.tagName === 'B' || c.tagName === 'STRONG') f.bold = true;
        if (c.tagName === 'I' || c.tagName === 'EM') f.italics = true;
        if (c.tagName === 'U') f.underline = {};
        r.push(...runs(c, f));
      }
    }
    return r;
  };
  const blocks = Array.from(d.childNodes);
  for (const n of blocks) {
    if (n.nodeType === 3) { if (n.textContent.trim()) out.push(new D.Paragraph({ children: [new D.TextRun(n.textContent)], spacing: { after: 120 } })); continue; }
    if (n.nodeType !== 1) continue;
    if (n.tagName === 'UL' || n.tagName === 'OL') {
      for (const li of n.querySelectorAll(':scope > li')) out.push(new D.Paragraph(Object.assign({ children: runs(li), spacing: { after: 60 } }, n.tagName === 'OL' ? { numbering: { reference: 'num', level: 0 } } : { bullet: { level: 0 } })));
    } else if (n.tagName === 'H4') out.push(new D.Paragraph({ children: runs(n, { bold: true }), spacing: { before: 120, after: 60 } }));
    else out.push(new D.Paragraph({ children: runs(n), spacing: { after: 120 } }));
  }
  return out;
}

async function blockToDocx(b, label, D, maxW) {
  if (b.type === 'text') return htmlToDocx(b.html, D);
  if (b.type === 'callout') {
    return [new D.Table({
      width: { size: 100, type: D.WidthType.PERCENTAGE },
      borders: { top: { style: D.BorderStyle.NONE }, bottom: { style: D.BorderStyle.NONE }, right: { style: D.BorderStyle.NONE }, left: { style: D.BorderStyle.SINGLE, size: 18, color: '1D5C8C' }, insideHorizontal: { style: D.BorderStyle.NONE }, insideVertical: { style: D.BorderStyle.NONE } },
      rows: [new D.TableRow({ children: [new D.TableCell({ children: htmlToDocx(b.html, D), shading: { fill: 'EEF4F9', type: D.ShadingType.CLEAR, color: 'auto' }, margins: { top: 100, bottom: 100, left: 180, right: 180 } })] })],
    }), new D.Paragraph({ children: [] })];
  }
  if (b.type === 'image') {
    const a = assetById(b.assetId);
    const cap = new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing: { after: 160 }, children: [new D.TextRun({ text: label + ': ', bold: true, size: 18 }), new D.TextRun({ text: b.caption || (a && a.caption) || '', size: 18 })] });
    if (!a) return [new D.Paragraph({ children: [new D.TextRun({ text: `[NEEDS VISUAL: ${b.need || b.caption || ''}]`, highlight: 'yellow' })] }), cap];
    const png = await imageToPng(a.dataUrl || a.thumb, maxW);
    return [new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.ImageRun({ data: png.data, transformation: { width: png.width, height: png.height } })] }), cap];
  }
  if (b.type === 'table') {
    const rows = (b.rows || []).map((r, ri) => new D.TableRow({
      tableHeader: ri === 0,
      children: r.map(c => new D.TableCell({ children: [new D.Paragraph({ children: [new D.TextRun({ text: String(c), bold: ri === 0, size: 19 })] })], shading: ri === 0 ? { fill: 'E6EDF4', type: D.ShadingType.CLEAR, color: 'auto' } : undefined, margins: { top: 40, bottom: 40, left: 80, right: 80 } })),
    }));
    return [
      new D.Paragraph({ spacing: { before: 120, after: 60 }, children: [new D.TextRun({ text: label + ': ', bold: true, size: 18 }), new D.TextRun({ text: b.caption || '', size: 18 })] }),
      new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows }),
      new D.Paragraph({ children: [] }),
    ];
  }
  return [];
}

async function buildDocx() {
  const D = window.docx;
  if (!D) throw new Error('The Word writer did not load. Reload the page and try again.');
  const p = S.project;
  numberSections();
  const rules = p.formatRules || {};
  const font = rules.fontFamily ? String(rules.fontFamily).split(',')[0].replace(/["']/g, '').trim() : 'Calibri';
  const sizePt = parseFloat(rules.fontSize) || 11;
  const children = [];
  // Cover
  children.push(new D.Paragraph({ spacing: { before: 2400, after: 240 }, children: [new D.TextRun({ text: p.name, bold: true, size: 48 })] }));
  if (p.context.client) children.push(new D.Paragraph({ spacing: { after: 120 }, children: [new D.TextRun({ text: 'Prepared for ' + p.context.client, size: 28 })] }));
  if (p.exportAuthor) children.push(new D.Paragraph({ spacing: { after: 120 }, children: [new D.TextRun({ text: 'Submitted by ' + p.exportAuthor, size: 24 })] }));
  children.push(new D.Paragraph({ children: [new D.TextRun({ text: new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }), size: 22 })] }));
  children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
  let fig = 0, tab = 0;
  for (const s of p.sections) {
    children.push(new D.Paragraph({ heading: s.level === 2 ? D.HeadingLevel.HEADING_2 : D.HeadingLevel.HEADING_1, spacing: { before: 240, after: 120 }, children: [new D.TextRun(`${s.num}  ${s.title}`)] }));
    for (let i = 0; i < s.blocks.length; i++) {
      const b = s.blocks[i];
      const label = b => b.type === 'image' ? 'Figure ' + (++fig) : b.type === 'table' ? 'Table ' + (++tab) : '';
      const nb = s.blocks[i + 1];
      if (b.width === 'half' && nb && nb.width === 'half') {
        // Two half-width blocks sit side by side in a borderless two-column table.
        const left = await blockToDocx(b, label(b), D, 300), right = await blockToDocx(nb, label(nb), D, 300);
        const none = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' };
        children.push(new D.Table({
          width: { size: 100, type: D.WidthType.PERCENTAGE },
          borders: { top: none, bottom: none, left: none, right: none, insideHorizontal: none, insideVertical: none },
          rows: [new D.TableRow({ children: [new D.TableCell({ width: { size: 50, type: D.WidthType.PERCENTAGE }, children: left.length ? left : [new D.Paragraph('')], margins: { right: 160 } }), new D.TableCell({ width: { size: 50, type: D.WidthType.PERCENTAGE }, children: right.length ? right : [new D.Paragraph('')], margins: { left: 160 } })] })],
        }));
        children.push(new D.Paragraph({ children: [] }));
        i++;
        continue;
      }
      children.push(...await blockToDocx(b, label(b), D, 600));
    }
  }
  const author = (p.exportAuthor || '').trim();
  const doc = new D.Document({
    creator: author || ' ', lastModifiedBy: author || ' ', title: p.name, description: '', subject: p.context.client || '', keywords: '',
    styles: {
      default: { document: { run: { font, size: Math.round(sizePt * 2) }, paragraph: { spacing: { line: 276 } } } },
      paragraphStyles: [
        { id: 'Heading1', name: 'Heading 1', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { font, size: 32, bold: true, color: '102A43' } },
        { id: 'Heading2', name: 'Heading 2', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { font, size: 26, bold: true, color: '102A43' } },
      ],
    },
    numbering: { config: [{ reference: 'num', levels: [{ level: 0, format: D.LevelFormat.DECIMAL, text: '%1.', alignment: D.AlignmentType.START, style: { paragraph: { indent: { left: 540, hanging: 260 } } } }] }] },
    sections: [{
      properties: { page: { margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 } } },
      footers: { default: new D.Footer({ children: [new D.Paragraph({ alignment: D.AlignmentType.RIGHT, children: [new D.TextRun({ children: [D.PageNumber.CURRENT], size: 18 })] })] }) },
      children,
    }],
  });
  return D.Packer.toBlob(doc);
}

function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportSourceMap() {

  });
  await saveFile(safeName(p.name) + '-source-map-INTERNAL.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'));

async function exportMatrix() {
  if (!window.XLSX) throw new Error('The spreadsheet writer did not load.');
  const p = S.project;
  const rows = [['Ref', 'RFP section', 'Requirement', 'Status', 'Response']];
  for (const m of p.matrix) { const r = reqById(m.reqId); if (r) rows.push([r.page || r.id, r.section, r.text, m.status, m.comment]); }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 70 }, { wch: 16 }, { wch: 70 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Compliance');
  wb.Props = { Author: p.exportAuthor || '', Title: p.name };
  const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  await saveFile(safeName(p.name) + '-compliance-matrix.xlsx', new Uint8Array(buf));
}

async function saveProjectFile() {
  await saveFile(safeName(S.project.name) + '.rfp.json', JSON.stringify(S.project));
}
async function openProjectFile(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.sections) || !Array.isArray(data.requirements)) throw new Error('bad');
    S.project = data;
    S.ui.step = 'inputs';
    save(); render();
    toast('Project opened.');
  } catch { toast('That file is not an RFP Engine project.', { err: true }); }
}
